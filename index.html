<style>

    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --ink:#1C2B45;
    --ink-soft:#5A6A85;
    --accent:#A9762F;
    --accent-soft:#EFE4CC;
    --line:#DCD5C4;
    --line-strong:#C7BFA9;
    --success:#3F6B4E;

    --danger:#8C3B33;

  html,body{margin:0;padding:0;}
  body{

  a{color:var(--accent);}
  header.app-header{

    padding:18px 28px;

    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;

/* =========================================================
   PENYIMPANAN
   Urutan prioritas:
   1) window.storage  -> tersedia saat aplikasi dibuka dari dalam Claude
   2) localStorage    -> tersedia saat file ini dibuka langsung di browser
                         (data tersimpan permanen di browser tsb, tidak perlu isi ulang)
   3) memori sementara -> cadangan terakhir jika keduanya diblokir browser
   ========================================================= */
const HAS_APP_STORAGE = (typeof window.storage !== 'undefined' && window.storage);
const HAS_LOCAL_STORAGE = (() => {
  try { const k='__test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
const memoryFallback = {};
const STORE_PREFIX = 'kepegawaian_';

const Store = {
  async get(key, fallback){
    if(HAS_APP_STORAGE){
      try{
        const r = await window.storage.get(key);
        if(r) return JSON.parse(r.value);
      }catch(e){ /* lanjut ke fallback di bawah */ }
    }
    if(HAS_LOCAL_STORAGE){
      try{
        const raw = localStorage.getItem(STORE_PREFIX + key);
        if(raw != null) return JSON.parse(raw);
      }catch(e){ /* lanjut ke memori */ }
    }
    return (key in memoryFallback) ? memoryFallback[key] : fallback;
  },
  async set(key, value){
    memoryFallback[key] = value; // selalu simpan juga di memori untuk sesi berjalan
    if(HAS_APP_STORAGE){
      try{ await window.storage.set(key, JSON.stringify(value)); }
      catch(e){ console.error('Gagal menyimpan ke window.storage', key, e); }
    }
    if(HAS_LOCAL_STORAGE){
      try{ localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); }
      catch(e){ console.error('Gagal menyimpan ke localStorage', key, e); }
    }
  }
};
const HAS_STORAGE = HAS_APP_STORAGE || HAS_LOCAL_STORAGE;

/* =========================================================
   INISIALISASI NAVIGASI & PANEL
   ========================================================= */
const tabNav = document.getElementById('tabNav');
const mainArea = document.getElementById('mainArea');

function buildNav(){
  CATEGORIES.forEach(cat=>{
    const btn = document.createElement('button');
    btn.dataset.tab = 'cat:' + cat.key;
    btn.textContent = cat.label;
    tabNav.insertBefore(btn, document.querySelector('.group-label:nth-of-type(2) + button ~ .group-label'));
  });
  // Re-order: simplest is to rebuild nav fully in desired order
  tabNav.innerHTML = '';
  const addLabel = (t)=>{ const d=document.createElement('div'); d.className='group-label'; d.textContent=t; tabNav.appendChild(d); };
  const addBtn = (tab,label)=>{ const b=document.createElement('button'); b.dataset.tab=tab; b.textContent=label; tabNav.appendChild(b); };
  addLabel('Data Pegawai');
  addBtn('sumber','Sumber Data Pegawai');
  addLabel('Input Data');
  CATEGORIES.forEach(cat=> addBtn('cat:'+cat.key, cat.label));
  addLabel('Laporan');
  addBtn('rekap','Rekap & Ekspor');
  addLabel('Lainnya');
  addBtn('pengaturan','Pengaturan');

  tabNav.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    showTab(btn.dataset.tab);
  });
}

function showTab(tab){
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-' + tab.replace(':','-')));
  if(tab === 'rekap') renderRekap();
}

let STANDARD_FIELDS = [
  { key:'nip', label:'NIP / Identitas', guess:['nip','nik','identitas'] },
  { key:'nama', label:'Nama', guess:['nama','name'] },
  { key:'jabatan', label:'Jabatan', guess:['jabatan','posisi','position'] },
  { key:'unit', label:'Unit Kerja', guess:['unit','satker','bidang','bagian'] },
];

function guessColumn(header, guesses){
  const h = header.toLowerCase();
  return guesses.some(g=> h.includes(g));
}

function handleRawImport(headers, rows){
  state.rawImport = { headers, rows };
  document.getElementById('mappingCard').style.display = 'block';
  const mappingArea = document.getElementById('mappingArea');
  mappingArea.innerHTML = STANDARD_FIELDS.map(f=>{
    let guessedIdx = headers.findIndex(h=> guessColumn(String(h||''), f.guess));
    const options = headers.map((h,i)=>`<option value="${i}" ${i===guessedIdx?'selected':''}>${h || '(Kolom '+(i+1)+')'}</option>`).join('');
    return `<div class="mapping-row">
      <label>${f.label}</label>
      <select data-map="${f.key}">
        <option value="-1">— tidak dipakai —</option>
        ${options}
      </select>
    </div>`;
  }).join('');

  const previewTable = document.getElementById('previewTable');
  const previewRows = rows.slice(0,5);
  previewTable.innerHTML = '<tr>' + headers.map(h=>`<th>${h||''}</th>`).join('') + '</tr>' +
    previewRows.map(r=> '<tr>' + headers.map((h,i)=>`<td>${r[i] ?? ''}</td>`).join('') + '</tr>').join('');
}

function confirmMapping(){
  const selects = document.querySelectorAll('#mappingArea select[data-map]');
  const mapping = {};
  selects.forEach(s=> mapping[s.dataset.map] = parseInt(s.value,10));
  const { rows } = state.rawImport;
  const employees = rows
    .filter(r=> r && r.some(c=> c !== '' && c != null))
    .map(r=>({
      nip: mapping.nip>=0 ? String(r[mapping.nip] ?? '').trim() : '',
      nama: mapping.nama>=0 ? String(r[mapping.nama] ?? '').trim() : '',
      jabatan: mapping.jabatan>=0 ? String(r[mapping.jabatan] ?? '').trim() : '',
      unit: mapping.unit>=0 ? String(r[mapping.unit] ?? '').trim() : '',
    }))
    .filter(e=> e.nama);
  state.employees = employees;
  Store.set('employees', employees);
  document.getElementById('mappingCard').style.display = 'none';
  state.rawImport = null;
  renderEmployeeSummary();
  showBanner('sumberBanner', 'ok', `Berhasil memuat ${employees.length} data pegawai.`);
}

function renderEmployeeSummary(){
  const count = state.employees.length;
  document.getElementById('employeeCountText').textContent = count
    ? `${count} pegawai termuat dan siap digunakan pada form input.`
    : 'Belum ada data pegawai dimuat.';
  renderEmployeeTable(state.employees.slice(0,50));
}

function renderEmployeeTable(list){
  const table = document.getElementById('employeeTable');
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Tidak ada data.</td></tr>'; return; }
  table.innerHTML = '<tr><th>NIP</th><th>Nama</th><th>Jabatan</th><th>Unit Kerja</th></tr>' +
    list.map(e=>`<tr><td>${e.nip||'-'}</td><td>${e.nama}</td><td>${e.jabatan||'-'}</td><td>${e.unit||'-'}</td></tr>`).join('');
}

function showBanner(elId, type, msg){
  const el = document.getElementById(elId);
  if(!el) return;
  el.innerHTML = `<div class="banner ${type}">${msg}</div>`;
}

/* =========================================================
   SINKRONISASI REALTIME DENGAN GOOGLE SHEETS
   Google Sheets diperlakukan sebagai satu-satunya sumber data.
   Setiap simpan/ubah/hapus langsung dikirim (POST), dan setiap
   buka/refresh langsung membaca ulang (GET) dari Sheets.
   ========================================================= */
function updateSyncIndicator(status){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  const now = new Date().toLocaleTimeString('id-ID');
  if(status === 'ok') el.innerHTML = `<span style="color:var(--success);">&#9679;</span> Realtime aktif &middot; terakhir diperbarui ${now}`;
  else if(status === 'syncing') el.innerHTML = `<span style="color:var(--accent);">&#9679;</span> Menyinkronkan...`;
  else if(status === 'off') el.innerHTML = `<span style="color:var(--ink-soft);">&#9679;</span> Realtime nonaktif — atur URL Web App di tab Pengaturan`;
  else el.innerHTML = `<span style="color:var(--danger);">&#9679;</span> Gagal terhubung ke Google Sheets &middot; menampilkan data tersimpan lokal terakhir`;
}

async function apiPost(body){
  const url = state.settings.webAppUrl;
  if(!url) return { error: 'URL Web App belum diatur.' };
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // hindari preflight CORS pada Apps Script
      body: JSON.stringify(body)
    });
    return await res.json();
  }catch(err){
    return { error: err.message };
  }
}

async function fetchAllRecordsFromSheets(){
  const url = state.settings.webAppUrl;
  if(!url) return false;
  try{
    const res = await fetch(`${url}?action=getRecords`);
    const json = await res.json();
    if(json.error) return false;
    state.records = json.records || [];
    Store.set('records', state.records);
    populateSuggestionDatalists();
    return true;
  }catch(err){ return false; }
}
async function fetchBidangFromSheets(){
  const url = state.settings.webAppUrl;
  if(!url) return false;
  try{
    const res = await fetch(`${url}?action=getBidang`);
    const json = await res.json();
    if(json.error) return false;
    state.bidangList = json.items || [];
    Store.set('bidangList', state.bidangList);
    return true;
  }catch(err){ return false; }
}
async function fetchSisaCutiFromSheets(){
  const url = state.settings.webAppUrl;
  if(!url) return false;
  try{
    const res = await fetch(`${url}?action=getSisaCuti`);
    const json = await res.json();
    if(json.error) return false;
    state.sisaCutiList = json.items || [];
    Store.set('sisaCutiList', state.sisaCutiList);
    return true;
  }catch(err){ return false; }
}
async function pushRecordToSheets(record){
  const result = await apiPost({ record });
  return !result.error;
}
async function deleteRecordFromSheets(kategoriKey, id){
  const result = await apiPost({ type:'deleteRecord', kategoriKey, id });
  return !result.error;
}

/** Menarik ulang semua data operasional (records, bidang, sisa cuti) dari Google Sheets
 *  dan me-render ulang tampilan yang sedang aktif. Dipakai saat buka aplikasi,
 *  polling berkala, tab kembali aktif, dan tombol "Muat Ulang". */
async function refreshFromSheetsAndRender(){
  if(!state.settings.webAppUrl){ updateSyncIndicator('off'); return; }
  updateSyncIndicator('syncing');
  const [okRecords] = await Promise.all([
    fetchAllRecordsFromSheets(),
    fetchBidangFromSheets(),
    fetchSisaCutiFromSheets(),
  ]);
  updateSyncIndicator(okRecords ? 'ok' : 'error');
  rerenderVisibleData();
}

/** Me-render ulang tabel/rekap yang sedang tampil, tanpa mengganggu form yang sedang diisi. */
function rerenderVisibleData(){
  const activeTab = document.querySelector('nav.tabs button.active');
  const tab = activeTab ? activeTab.dataset.tab : '';
  if(tab === 'rekap') renderRekap();
  if(tab === 'cat:cuti'){
    const activeSub = document.querySelector('#cutiMainTabs button.active');
    const key = activeSub ? activeSub.dataset.key : 'permohonan';
    if(key === 'berjalan') renderCutiBerjalan();
    if(key === 'rekap') renderRekapCutiAll();
    if(key === 'pengaturan'){ renderBidangTable(); renderSisaCutiTable(); }
  }
  const simpleKey = tab.startsWith('cat:') ? tab.slice(4) : null;
  if(simpleKey && MONTHLY_RECAP_KEYS.includes(simpleKey)){
    const activeSub = document.querySelector(`#subTabs_${simpleKey} button.active`);
    const key = activeSub ? activeSub.dataset.key : 'permohonan';
    if(key === 'rekap') renderMonthlyRekap({ key: simpleKey }, true);
  }
}

async function fetchPegawaiFromGoogle(){
  const url = state.settings.webAppUrl;
  const sheetName = document.getElementById('inpSheetPegawai').value.trim() || 'Pegawai';
  if(!url){
    showBanner('sumberBanner','warn','Atur URL Web App Google Apps Script terlebih dahulu di tab Pengaturan.');
    return;
  }
  showBanner('sumberBanner','info','Mengambil data, mohon tunggu...');
  try{
    const res = await fetch(`${url}?action=getPegawai&sheet=${encodeURIComponent(sheetName)}`);
    const json = await res.json();
    if(json.error){ showBanner('sumberBanner','warn', 'Gagal: ' + json.error); return; }
    const data = json.data || [];
    if(!data.length){ showBanner('sumberBanner','warn','Sheet kosong atau tidak ditemukan.'); return; }
    const headers = data[0];
    const rows = data.slice(1);
    handleRawImport(headers, rows);
    showBanner('sumberBanner','ok','Data berhasil diambil. Silakan cocokkan kolom di bawah.');
  }catch(err){
    showBanner('sumberBanner','warn','Gagal terhubung ke Web App. Periksa URL dan pengaturan deployment (akses: Siapa saja). Detail: ' + err.message);
  }
}

function handleExcelFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(e.target.result, { type:'binary' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(!aoa.length){ showBanner('sumberBanner','warn','File kosong.'); return; }
    handleRawImport(aoa[0], aoa.slice(1));
  };
  reader.readAsBinaryString(file);
}

/** Coba tebak pemetaan kolom otomatis dari header. Mengembalikan mapping bila
 *  NIP & Nama berhasil ditebak dengan jelas, atau null bila ambigu/tidak ditemukan. */
function tryAutoMapping(headers){
  const mapping = {};
  STANDARD_FIELDS.forEach(f=>{
    mapping[f.key] = headers.findIndex(h=> guessColumn(String(h||''), f.guess));
  });
  if(mapping.nip < 0 || mapping.nama < 0) return null;
  return mapping;
}

/** Dipanggil otomatis saat aplikasi dibuka (bila URL Web App & nama sheet sudah diatur).
 *  Jika kolom NIP & Nama bisa ditebak otomatis, data pegawai langsung dimuat tanpa
 *  perlu konfirmasi manual, supaya siapa pun yang membuka aplikasi langsung siap pakai. */
async function autoLoadEmployeesIfConfigured(){
  const url = state.settings.webAppUrl;
  const sheetName = state.settings.sheetPegawai || 'Sheet1';
  if(!url) return;
  try{
    const res = await fetch(`${url}?action=getPegawai&sheet=${encodeURIComponent(sheetName)}`);
    const json = await res.json();
    if(json.error || !json.data || !json.data.length) return;
    const headers = json.data[0];
    const rows = json.data.slice(1);
    const mapping = tryAutoMapping(headers);
    if(!mapping){
      // ambigu -> biarkan seperti semula, tampilkan kartu pencocokan manual
      handleRawImport(headers, rows);
      showBanner('sumberBanner','warn','Kolom NIP/Nama tidak dapat ditebak otomatis. Silakan cocokkan manual di bawah.');
      return;
    }
    const employees = rows
      .filter(r=> r && r.some(c=> c !== '' && c != null))
      .map(r=>({
        nip: mapping.nip>=0 ? String(r[mapping.nip] ?? '').trim() : '',
        nama: mapping.nama>=0 ? String(r[mapping.nama] ?? '').trim() : '',
        jabatan: mapping.jabatan>=0 ? String(r[mapping.jabatan] ?? '').trim() : '',
        unit: mapping.unit>=0 ? String(r[mapping.unit] ?? '').trim() : '',
      }))
      .filter(e=> e.nama);
    state.employees = employees;
    Store.set('employees', employees);
    renderEmployeeSummary();
    showBanner('sumberBanner','ok', `${employees.length} data pegawai otomatis dimuat dari spreadsheet sumber.`);
  }catch(err){
    // gagal diam-diam saat auto-load; tombol manual tetap tersedia
  }
}

function fieldHTML(catKey, f){
  const id = `f_${catKey}_${f.id}`;
  if(f.type === 'select'){
    return `<div class="field"><label for="${id}">${f.label}</label>
      <select id="${id}"><option value="">— pilih —</option>${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
  }
  if(f.suggest){
    return `<div class="field"><label for="${id}">${f.label}</label>
      <input type="text" id="${id}" list="dl_${f.id}" autocomplete="off">
      <datalist id="dl_${f.id}"></datalist></div>`;
  }
  return `<div class="field"><label for="${id}">${f.label}</label><input type="${f.type}" id="${id}"></div>`;
}

const SUGGESTION_FIELD_IDS = ['asalInstansi','namaDiklat','penyelenggara','tempat','unitPenempatan','pejabatPenetap'];
function populateSuggestionDatalists(){
  SUGGESTION_FIELD_IDS.forEach(fid=>{
    const dl = document.getElementById(`dl_${fid}`);
    if(!dl) return;
    const values = Array.from(new Set(
      state.records.map(r=> r.detail && r.detail[fid]).filter(v=> v && String(v).trim())
    )).sort((a,b)=> String(a).localeCompare(String(b)));
    dl.innerHTML = values.map(v=>`<option value="${String(v).replace(/"/g,'&quot;')}"></option>`).join('');
  });
}

function wireCategoryPanel(cat){
  const manualCheckbox = document.getElementById(`manual_${cat.key}`);
  manualCheckbox.addEventListener('change', ()=>{
    document.getElementById(`pegawaiPicker_${cat.key}`).style.display = manualCheckbox.checked ? 'none' : 'block';
    document.getElementById(`manualFields_${cat.key}`).style.display = manualCheckbox.checked ? 'block' : 'none';
    state.selectedEmployee[cat.key] = null;
  });

  const searchInput = document.getElementById(`search_${cat.key}`);
  const resultsBox = document.getElementById(`results_${cat.key}`);
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    if(q.length < 2){ resultsBox.style.display='none'; return; }
    const matches = state.employees.filter(e=>
      (e.nama||'').toLowerCase().includes(q) || (e.nip||'').toLowerCase().includes(q)
    ).slice(0,15);
    if(!matches.length){ resultsBox.innerHTML = '<div>Tidak ditemukan</div>'; resultsBox.style.display='block'; return; }
    resultsBox.innerHTML = matches.map((e,i)=>`<div data-idx="${i}">${e.nama} — ${e.nip||'tanpa NIP'} <span style="color:var(--ink-soft)">(${e.jabatan||'-'})</span></div>`).join('');
    resultsBox.style.display = 'block';
    resultsBox.querySelectorAll('div[data-idx]').forEach(div=>{
      div.addEventListener('click', ()=>{
        const emp = matches[parseInt(div.dataset.idx,10)];
        state.selectedEmployee[cat.key] = emp;
        document.getElementById(`selected_${cat.key}`).textContent = `Terpilih: ${emp.nama} (${emp.nip||'-'})`;
        searchInput.value = emp.nama;
        resultsBox.style.display = 'none';
      });
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest(`#pegawaiPicker_${cat.key}`)) resultsBox.style.display='none';
  });

  document.querySelector(`[data-save="${cat.key}"]`).addEventListener('click', ()=> saveRecord(cat));
  document.querySelector(`[data-reset="${cat.key}"]`).addEventListener('click', ()=> resetCategoryForm(cat));
}

async function saveRecord(cat){
  const isManual = document.getElementById(`manual_${cat.key}`).checked;
  let nama, nip, jabatan, unit, sumber;
  if(isManual){
    nama = document.getElementById(`manualNama_${cat.key}`).value.trim();
    nip = document.getElementById(`manualNip_${cat.key}`).value.trim();
    jabatan = document.getElementById(`manualJabatan_${cat.key}`).value.trim();
    unit = document.getElementById(`manualUnit_${cat.key}`).value.trim();
    sumber = 'Manual';
  } else {
    const emp = state.selectedEmployee[cat.key];
    if(!emp){ showBanner(`formBanner_${cat.key}`,'warn','Pilih pegawai terlebih dahulu, atau centang input manual.'); return; }
    nama = emp.nama; nip = emp.nip; jabatan = emp.jabatan; unit = emp.unit;
    sumber = 'Data Pegawai';
  }
  if(!nama){ showBanner(`formBanner_${cat.key}`,'warn','Nama wajib diisi.'); return; }
  if(!state.settings.webAppUrl){ showBanner(`formBanner_${cat.key}`,'warn','URL Web App belum diatur — buka tab Pengaturan terlebih dahulu agar data bisa tersimpan realtime.'); return; }

  const detail = {};
  cat.fields.forEach(f=> detail[f.id] = document.getElementById(`f_${cat.key}_${f.id}`).value);

  const record = {
    id: genId(),
    kategoriKey: cat.key,
    kategoriLabel: cat.label,
    sheet: cat.sheet,
    sumber, nama, nip, jabatan, unit,
    detail,
    catatan: document.getElementById(`catatan_${cat.key}`).value.trim(),
    tanggalInput: new Date().toISOString(),
  };

  const btn = document.querySelector(`[data-save="${cat.key}"]`);
  btn.disabled = true;
  showBanner(`formBanner_${cat.key}`,'info','Menyimpan ke Google Sheets...');
  const ok = await pushRecordToSheets(record);
  btn.disabled = false;
  if(!ok){
    showBanner(`formBanner_${cat.key}`,'warn','Gagal menyimpan ke Google Sheets. Periksa koneksi internet Anda, lalu coba lagi. Data belum tersimpan.');
    return;
  }
  await fetchAllRecordsFromSheets();
  showBanner(`formBanner_${cat.key}`,'ok', `Data ${cat.label} untuk ${nama} berhasil disimpan.`);
  resetCategoryForm(cat);
  if(MONTHLY_RECAP_KEYS.includes(cat.key)) renderMonthlyRekap(cat, true);
}

/* =========================================================
   REKAP PER BULAN (Izin Pernikahan, Izin Perceraian, Izin Keluar Negeri)
   Periode rekap mengacu pada Tanggal Persetujuan Pimpinan.
   ========================================================= */
const BULAN_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function monthKeyFromDate(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabelFromKey(monthKey){
  const [y,m] = monthKey.split('-');
  return `${BULAN_NAMES[parseInt(m,10)-1]} ${y}`;
}

function wireMonthlyRekap(cat){
  wireSimpleSubtabs(`subTabs_${cat.key}`, {
    permohonan: `sub-${cat.key}-permohonan`,
    rekap: `sub-${cat.key}-rekap`,
  }, (key)=>{ if(key==='rekap') renderMonthlyRekap(cat, true); });

  document.getElementById(`filterBulan_${cat.key}`).addEventListener('change', ()=> renderMonthlyRekap(cat, false));
  document.querySelector(`[data-export-excel="${cat.key}"]`).addEventListener('click', ()=> exportMonthlyRekapExcel(cat));
  document.querySelector(`[data-export-pdf="${cat.key}"]`).addEventListener('click', ()=> exportMonthlyRekapPDF(cat));
}

function renderMonthlyRekap(cat, rebuildOptions){
  const records = state.records.filter(r=> r.kategoriKey === cat.key);
  const select = document.getElementById(`filterBulan_${cat.key}`);
  if(!select) return;
  if(rebuildOptions){
    const months = Array.from(new Set(records.map(r=> monthKeyFromDate(r.detail.tglPersetujuanPimpinan)).filter(Boolean))).sort().reverse();
    const current = select.value;
    select.innerHTML = '<option value="">Semua Bulan</option>' + months.map(m=>`<option value="${m}" ${m===current?'selected':''}>${monthLabelFromKey(m)}</option>`).join('');
  }
  const filterMonth = select.value;
  const list = records.filter(r=> !filterMonth || monthKeyFromDate(r.detail.tglPersetujuanPimpinan) === filterMonth);
  const table = document.getElementById(`rekapTable_${cat.key}`);
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Tidak ada data pada periode ini.</td></tr>'; return; }
  table.innerHTML = '<tr><th>Nama</th><th>NIP/Ket.</th><th>Tgl Pengajuan Pegawai</th><th>Tgl Persetujuan Pimpinan</th><th>Nomor Surat</th><th>Status KEP</th><th>Nomor KEP</th><th>Tanggal KEP</th></tr>' +
    list.slice().sort((a,b)=> (b.detail.tglPersetujuanPimpinan||'').localeCompare(a.detail.tglPersetujuanPimpinan||'')).map(r=>`<tr>
      <td>${r.nama}</td><td>${r.nip||'-'}</td>
      <td>${formatTanggalID(r.detail.tglPengajuanPegawai)}</td><td>${formatTanggalID(r.detail.tglPersetujuanPimpinan)}</td>
      <td>${r.detail.nomorSurat||'-'}</td><td>${r.detail.statusKep||'-'}</td>
      <td>${r.detail.nomorKep||'-'}</td><td>${formatTanggalID(r.detail.tanggalKep)}</td>
    </tr>`).join('');
}
function exportMonthlyRekapExcel(cat){ exportTableToExcel(`rekapTable_${cat.key}`, `Rekap_${cat.sheet.replace(/\s+/g,'_')}_${todayStamp()}.xlsx`, cat.label); }
function exportMonthlyRekapPDF(cat){ exportTableToPDF(`rekapTable_${cat.key}`, `Rekap_${cat.sheet.replace(/\s+/g,'_')}_${todayStamp()}.pdf`, `Rekap ${cat.label}`); }

/* ---------- Helper Sisa Cuti & Bidang ---------- */
function findBidang(nip){
  const e = state.bidangList.find(b=> b.nip === nip);
  return e ? e.bidang : '';
}
function findSisaCuti(nip){
  return state.sisaCutiList.find(s=> s.nip === nip) || null;
}
function sisaCutiText(nip){
  const s = findSisaCuti(nip);
  if(!s) return 'Data sisa cuti belum tersedia. Sinkronkan pada Pengaturan &rarr; Sisa Cuti.';
  return `Tahun Berjalan: ${s.berjalan} hari &middot; 1 Tahun Sebelumnya: ${s.tahunLalu} hari &middot; 2 Tahun Sebelumnya: ${s.duaTahunLalu} hari`;
}
function mergeEmployeesIntoBidang(){
  let added = 0;
  state.employees.forEach(e=>{
    if(!e.nip) return;
    const existing = state.bidangList.find(b=> b.nip === e.nip);
    if(existing){ existing.nama = e.nama || existing.nama; }
    else { state.bidangList.push({ nip:e.nip, nama:e.nama, bidang:'' }); added++; }
  });
  Store.set('bidangList', state.bidangList);
  return added;
}
function mergeEmployeesIntoSisaCuti(){
  let added = 0;
  state.employees.forEach(e=>{
    if(!e.nip) return;
    const existing = state.sisaCutiList.find(s=> s.nip === e.nip);
    if(existing){ existing.nama = e.nama || existing.nama; }
    else { state.sisaCutiList.push({ nip:e.nip, nama:e.nama, berjalan:12, tahunLalu:6, duaTahunLalu:6 }); added++; }
  });
  Store.set('sisaCutiList', state.sisaCutiList);
  return added;
}
function deductSisaCuti(nip, jumlahHari, checks){
  const s = findSisaCuti(nip);
  const breakdown = { duaTahunLalu:0, tahunLalu:0, berjalan:0 };
  if(!s || !jumlahHari) return breakdown;
  let remaining = jumlahHari;
  [
    { key:'duaTahunLalu', on:checks.duaTahunLalu },
    { key:'tahunLalu', on:checks.tahunLalu },
    { key:'berjalan', on:checks.berjalan },
  ].forEach(o=>{
    if(!o.on || remaining <= 0) return;
    const take = Math.min(s[o.key], remaining);
    s[o.key] -= take;
    breakdown[o.key] = take;
    remaining -= take;
  });
  Store.set('sisaCutiList', state.sisaCutiList);
  return breakdown;
}
function restoreSisaCuti(nip, breakdown){
  const s = findSisaCuti(nip);
  if(!s || !breakdown) return;
  s.duaTahunLalu += breakdown.duaTahunLalu || 0;
  s.tahunLalu += breakdown.tahunLalu || 0;
  s.berjalan += breakdown.berjalan || 0;
  Store.set('sisaCutiList', state.sisaCutiList);
}
function allCutiRecords(){
  return state.records.filter(r=> r.kategoriKey === 'cuti');
}
function isCutiSedangBerjalanTanggal(r){
  const today = new Date(); today.setHours(0,0,0,0);
  const mulai = r.detail.tglMulai ? new Date(r.detail.tglMulai) : null;
  const selesai = r.detail.tglSelesai ? new Date(r.detail.tglSelesai) : null;
  if(!mulai || !selesai) return false;
  return today >= mulai && today <= selesai;
}

/** Menampilkan tanggal dalam format DD-MM-YYYY, apa pun bentuk aslinya
 *  (baik "2026-08-31" maupun "2026-08-31T17:00:00.000Z"). */
function formatTanggalID(value){
  if(!value) return '-';
  const s = String(value);
  const datePart = s.length >= 10 ? s.slice(0,10) : s;
  const parts = datePart.split('-');
  if(parts.length === 3 && parts[0].length === 4){
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }
  return s;
}

/* ---------- Sub-tab switching (generik) ---------- */
function wireSimpleSubtabs(navId, panels, onShow){
  const nav = document.getElementById(navId);
  nav.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-key]');
    if(!btn) return;
    nav.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b===btn));
    Object.entries(panels).forEach(([key, elId])=>{
      document.getElementById(elId).style.display = (key===btn.dataset.key) ? 'block':'none';
    });
    if(onShow) onShow(btn.dataset.key);
  });
}

function wireCutiPermohonan(){

async function saveCutiRecord(){
  const isManual = document.getElementById('manual_cuti').checked;
  let nama, nip, jabatan, unit, sumber, bidang;
  if(isManual){
    nama = document.getElementById('manualNama_cuti').value.trim();
    nip = document.getElementById('manualNip_cuti').value.trim();
    jabatan = document.getElementById('manualJabatan_cuti').value.trim();
    unit = document.getElementById('manualUnit_cuti').value.trim();
    bidang = document.getElementById('bidangManual_cuti').value;
    sumber = 'Manual';
  } else {
    const emp = state.cutiSelected;
    if(!emp){ showBanner('formBanner_cuti','warn','Pilih pegawai terlebih dahulu, atau centang input manual.'); return; }
    nama = emp.nama; nip = emp.nip; jabatan = emp.jabatan; unit = emp.unit;
    bidang = document.getElementById('bidang_cuti').value; // dropdown selalu jadi acuan akhir, walau berbeda dari default
    sumber = 'Data Pegawai';
  }
  if(!nama){ showBanner('formBanner_cuti','warn','Nama wajib diisi.'); return; }
  if(!bidang){ showBanner('formBanner_cuti','warn','Pilih Bidang terlebih dahulu.'); return; }
  if(!state.settings.webAppUrl){ showBanner('formBanner_cuti','warn','URL Web App belum diatur — buka tab Pengaturan terlebih dahulu agar data bisa tersimpan realtime.'); return; }

  const jumlahHari = parseFloat(document.getElementById('f_cuti_jumlahHari').value) || 0;
  const checks = {
    berjalan: document.getElementById('chkBerjalan_cuti').checked,
    tahunLalu: document.getElementById('chkTahunLalu_cuti').checked,
    duaTahunLalu: document.getElementById('chkDuaTahunLalu_cuti').checked,
  };
  const statusAwal = document.getElementById('statusAwal_cuti').value;

  const detail = {
    jenisCuti: document.getElementById('f_cuti_jenisCuti').value,
    tglMulai: document.getElementById('f_cuti_tglMulai').value,
    tglSelesai: document.getElementById('f_cuti_tglSelesai').value,
    jumlahHari: document.getElementById('f_cuti_jumlahHari').value,
    alasan: document.getElementById('f_cuti_alasan').value,
    nomorSurat: document.getElementById('f_cuti_nomorSurat').value,
    pejabat: document.getElementById('f_cuti_pejabat').value,
    bidang,
    tahunBerjalan: checks.berjalan ? 'Ya' : 'Tidak',
    tahunLalu: checks.tahunLalu ? 'Ya' : 'Tidak',
    duaTahunLalu: checks.duaTahunLalu ? 'Ya' : 'Tidak',
    statusAwal,
    statusCuti: statusAwal,
    potongBerjalanHari: 0, potongTahunLaluHari: 0, potongDuaTahunLaluHari: 0,
    sudahDipotong: 'Tidak',
  };

  let breakdown = { berjalan:0, tahunLalu:0, duaTahunLalu:0 };
  let deducted = false;
  if(CUTI_DEDUCTING_STATUSES.includes(statusAwal)){
    breakdown = deductSisaCuti(nip, jumlahHari, checks); // memotong di salinan lokal state.sisaCutiList
    deducted = true;
    detail.potongBerjalanHari = breakdown.berjalan;
    detail.potongTahunLaluHari = breakdown.tahunLalu;
    detail.potongDuaTahunLaluHari = breakdown.duaTahunLalu;
    detail.sudahDipotong = 'Ya';
  }

  const record = {
    id: genId(), kategoriKey:'cuti', kategoriLabel:'Izin Cuti', sheet:'Izin Cuti',
    sumber, nama, nip, jabatan, unit, detail,
    catatan: document.getElementById('catatan_cuti').value.trim(),
    tanggalInput: new Date().toISOString(),
  };

  const btn = document.getElementById('btnSaveCuti');
  btn.disabled = true;
  showBanner('formBanner_cuti','info','Menyimpan ke Google Sheets...');
  const okRecord = await pushRecordToSheets(record);
  if(!okRecord){
    btn.disabled = false;
    if(deducted) restoreSisaCuti(nip, breakdown); // batalkan potongan lokal karena gagal simpan
    showBanner('formBanner_cuti','warn','Gagal menyimpan ke Google Sheets. Periksa koneksi internet Anda, lalu coba lagi. Data belum tersimpan.');
    return;
  }
  if(deducted) await pushSisaCutiToSheets();
  await Promise.all([fetchAllRecordsFromSheets(), fetchSisaCutiFromSheets()]);
  btn.disabled = false;
  showBanner('formBanner_cuti','ok', `Permohonan cuti untuk ${nama} berhasil disimpan (status: ${statusAwal}).`);
  resetCutiForm();
  renderSisaCutiTable();
}

/* ---------- CUTI BERJALAN ---------- */
function renderCutiBerjalan(){
  const list = allCutiRecords().filter(r=> r.detail.statusCuti === 'Pengajuan' || isCutiSedangBerjalanTanggal(r));
  const table = document.getElementById('cutiBerjalanTable');
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Tidak ada pengajuan atau cuti yang sedang berjalan.</td></tr>'; return; }
  table.innerHTML = '<tr><th>Nama</th><th>NIP</th><th>Bidang</th><th>Jenis Cuti</th><th>Tanggal Mulai</th><th>Tanggal Selesai</th><th>Jml Hari</th><th>Status Cuti</th></tr>' +
    list.slice().reverse().map(r=>`
      <tr>
        <td>${r.nama}</td><td>${r.nip||'-'}</td><td>${r.detail.bidang||'-'}</td>
        <td>${r.detail.jenisCuti||'-'}</td><td>${formatTanggalID(r.detail.tglMulai)}</td><td>${formatTanggalID(r.detail.tglSelesai)}</td>
        <td>${r.detail.jumlahHari||'-'}</td>
        <td><select data-status-id="${r.id}">${CUTI_STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===r.detail.statusCuti?'selected':''}>${s}</option>`).join('')}</select></td>
      </tr>`).join('');

  table.querySelectorAll('[data-status-id]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const rec = state.records.find(r=> r.id === sel.dataset.statusId);
      if(!rec) return;
      const prevStatus = rec.detail.statusCuti;
      const prevBreakdown = {
        potongBerjalanHari: rec.detail.potongBerjalanHari || 0,
        potongTahunLaluHari: rec.detail.potongTahunLaluHari || 0,
        potongDuaTahunLaluHari: rec.detail.potongDuaTahunLaluHari || 0,
        sudahDipotong: rec.detail.sudahDipotong || 'Tidak',
      };
      const newStatus = sel.value;
      sel.disabled = true;
      const wasDeducting = CUTI_DEDUCTING_STATUSES.includes(prevStatus);
      const willDeduct = CUTI_DEDUCTING_STATUSES.includes(newStatus);
      let appliedAmount = null; // jumlah yang baru saja dipotong (untuk dibatalkan bila gagal)
      let restoredAmount = null; // jumlah yang baru saja dikembalikan (untuk dipotong ulang bila gagal)

      if(!wasDeducting && willDeduct && rec.detail.sudahDipotong !== 'Ya'){
        const checks = { berjalan: rec.detail.tahunBerjalan==='Ya', tahunLalu: rec.detail.tahunLalu==='Ya', duaTahunLalu: rec.detail.duaTahunLalu==='Ya' };
        const bd = deductSisaCuti(rec.nip, parseFloat(rec.detail.jumlahHari)||0, checks);
        rec.detail.potongBerjalanHari = bd.berjalan;
        rec.detail.potongTahunLaluHari = bd.tahunLalu;
        rec.detail.potongDuaTahunLaluHari = bd.duaTahunLalu;
        rec.detail.sudahDipotong = 'Ya';
        appliedAmount = bd;
      } else if(wasDeducting && !willDeduct && rec.detail.sudahDipotong === 'Ya'){
        restoredAmount = {
          berjalan: Number(rec.detail.potongBerjalanHari)||0,
          tahunLalu: Number(rec.detail.potongTahunLaluHari)||0,
          duaTahunLalu: Number(rec.detail.potongDuaTahunLaluHari)||0,
        };
        restoreSisaCuti(rec.nip, restoredAmount);
        rec.detail.potongBerjalanHari = 0;
        rec.detail.potongTahunLaluHari = 0;
        rec.detail.potongDuaTahunLaluHari = 0;
        rec.detail.sudahDipotong = 'Tidak';
      }
      rec.detail.statusCuti = newStatus;

      const ok = await pushRecordToSheets(rec);
      if(!ok){
        // gagal simpan -> kembalikan semua perubahan lokal seperti semula
        if(appliedAmount) restoreSisaCuti(rec.nip, appliedAmount);
        if(restoredAmount) deductSisaCuti(rec.nip, restoredAmount.berjalan + restoredAmount.tahunLalu + restoredAmount.duaTahunLalu, { berjalan: restoredAmount.berjalan>0, tahunLalu: restoredAmount.tahunLalu>0, duaTahunLalu: restoredAmount.duaTahunLalu>0 });
        rec.detail.statusCuti = prevStatus;
        rec.detail.potongBerjalanHari = prevBreakdown.potongBerjalanHari;
        rec.detail.potongTahunLaluHari = prevBreakdown.potongTahunLaluHari;
        rec.detail.potongDuaTahunLaluHari = prevBreakdown.potongDuaTahunLaluHari;
        rec.detail.sudahDipotong = prevBreakdown.sudahDipotong;
        sel.value = prevStatus;
        sel.disabled = false;
        alert('Gagal menyimpan perubahan status ke Google Sheets. Periksa koneksi internet Anda.');
        return;
      }
      if(appliedAmount || restoredAmount) await pushSisaCutiToSheets();
      await Promise.all([fetchAllRecordsFromSheets(), fetchSisaCutiFromSheets()]);
      sel.disabled = false;
      renderCutiBerjalan();
      renderSisaCutiTable();
    });
  });
}

function handleBidangExcel(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(e.target.result, { type:'binary' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(!aoa.length){ showBanner('bidangBanner','warn','File kosong.'); return; }
    const headers = aoa[0];
    const nipIdx = headers.findIndex(h=> String(h||'').toLowerCase().includes('nip'));
    const bidangIdx = headers.findIndex(h=> String(h||'').toLowerCase().includes('bidang'));
    const namaIdx = headers.findIndex(h=> String(h||'').toLowerCase().includes('nama'));
    if(nipIdx < 0 || bidangIdx < 0){ showBanner('bidangBanner','warn','Kolom NIP dan/atau Bidang tidak terdeteksi pada file ini.'); return; }
    let updated = 0, added = 0;
    aoa.slice(1).forEach(row=>{
      const nip = String(row[nipIdx]||'').trim();
      const bidang = String(row[bidangIdx]||'').trim();
      if(!nip) return;
      let entry = state.bidangList.find(b=> b.nip === nip);
      if(entry){ entry.bidang = bidang; updated++; }
      else { state.bidangList.push({ nip, nama: namaIdx>=0? String(row[namaIdx]||'').trim() : '', bidang }); added++; }
    });
    Store.set('bidangList', state.bidangList);
    renderBidangTable();
    showBanner('bidangBanner','ok', `Berhasil memproses file: ${updated} diperbarui, ${added} ditambahkan. Mengirim ke Google Sheets...`);
    pushBidangToSheets(true);
  };
  reader.readAsBinaryString(file);
}

async function pushBidangToSheets(afterUpload){
  const url = state.settings.webAppUrl;
  if(!url){ showBanner('bidangBanner','warn','Atur URL Web App di tab Pengaturan (global) terlebih dahulu.'); return; }
  if(!afterUpload) showBanner('bidangBanner','info','Menyimpan data Bidang ke Google Sheets...');
  try{
    const res = await fetch(url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ type:'bidang', items: state.bidangList })
    });
    const json = await res.json();
    if(json.error){ showBanner('bidangBanner','warn','Gagal: ' + json.error); return; }
    showBanner('bidangBanner','ok', `Data Bidang (${state.bidangList.length} pegawai) tersimpan ke Google Sheets.`);
  }catch(err){
    showBanner('bidangBanner','warn','Gagal terhubung ke Web App. Detail: ' + err.message);
  }
}

  const url = state.settings.webAppUrl;
  if(!url){ showBanner('sisaCutiBanner','warn','Atur URL Web App di tab Pengaturan (global) terlebih dahulu.'); return; }
  showBanner('sisaCutiBanner','info','Menyimpan data Sisa Cuti ke Google Sheets...');
  try{
    const res = await fetch(url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ type:'sisaCuti', items: state.sisaCutiList })
    });
    const json = await res.json();
    if(json.error){ showBanner('sisaCutiBanner','warn','Gagal: ' + json.error); return; }
    showBanner('sisaCutiBanner','ok', `Data Sisa Cuti (${state.sisaCutiList.length} pegawai) tersimpan ke Google Sheets.`);
  }catch(err){
    showBanner('sisaCutiBanner','warn','Gagal terhubung ke Web App. Detail: ' + err.message);
  }
}

function currentFilteredRecords(){
  const kategori = document.getElementById('filterKategori').value;
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  return state.records.filter(r=>{
    if(kategori && r.kategoriKey !== kategori) return false;
    if(q && !(r.nama.toLowerCase().includes(q) || (r.nip||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderRekap(){
  const summaryEl = document.getElementById('summaryCards');
  summaryEl.innerHTML = CATEGORIES.map(c=>{
    const n = state.records.filter(r=>r.kategoriKey===c.key).length;
    return `<div class="summary-card"><div class="num">${n}</div><div class="lbl">${c.label}</div></div>`;
  }).join('');
  renderRecordsTable();
}

function ringkasanDetail(r){
  const cat = CATEGORIES.find(c=>c.key===r.kategoriKey);
  return cat.fields.slice(0,3).map(f=> r.detail[f.id] ? `${f.label}: ${r.detail[f.id]}` : null).filter(Boolean).join(' · ');
}

function renderRecordsTable(){
  const list = currentFilteredRecords();
  const table = document.getElementById('recordsTable');
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Belum ada data yang cocok dengan filter.</td></tr>'; return; }
  table.innerHTML = '<tr><th>Kategori</th><th>Nama</th><th>NIP/Ket.</th><th>Jabatan/Unit</th><th>Ringkasan</th><th>Tgl Input</th><th>Aksi</th></tr>' +
    list.slice().reverse().map(r=>`
      <tr>
        <td>${r.kategoriLabel}</td>
        <td>${r.nama}</td>
        <td>${r.nip||'-'}</td>
        <td>${r.jabatan||'-'}${r.unit? ' / '+r.unit:''}</td>
        <td>${ringkasanDetail(r)}</td>
        <td>${new Date(r.tanggalInput).toLocaleDateString('id-ID')}</td>
        <td><button class="btn danger" data-del="${r.id}" data-cat="${r.kategoriKey}" style="padding:4px 8px;font-size:12px;">Hapus</button></td>
      </tr>`).join('');

  table.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Hapus data ini? Data akan dihapus permanen dari Google Sheets.')) return;
      btn.disabled = true;
      const ok = await deleteRecordFromSheets(btn.dataset.cat, btn.dataset.del);
      if(!ok){
        btn.disabled = false;
        alert('Gagal menghapus data di Google Sheets. Periksa koneksi internet Anda.');
        return;
      }
      await fetchAllRecordsFromSheets();
      renderRekap();
    });
  });
}

/* ---------- Ekspor generik (dipakai di semua tampilan rekap) ---------- */
function todayStamp(){ return new Date().toISOString().slice(0,10); }

function exportTableToExcel(tableId, filename, sheetName){
  const table = document.getElementById(tableId);
  if(!table || !table.querySelector('th')){ alert('Tidak ada data untuk diekspor.'); return; }
  const wb = XLSX.utils.table_to_book(table, { sheet: (sheetName||'Sheet1').slice(0,31) });
  XLSX.writeFile(wb, filename);
}
function exportTableToPDF(tableId, filename, title){
  const table = document.getElementById(tableId);
  if(!table || !table.querySelector('th')){ alert('Tidak ada data untuk diekspor.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  doc.setFontSize(12);
  doc.text(title, 14, 12);
  doc.autoTable({ html: '#'+tableId, startY: 18, styles:{ fontSize:8 } });
  doc.save(filename);
}

function exportToExcel(){
  const list = currentFilteredRecords();
  if(!list.length){ showBanner('rekapBanner','warn','Tidak ada data untuk diekspor.'); return; }
  const wb = XLSX.utils.book_new();
  CATEGORIES.forEach(cat=>{
    const rows = list.filter(r=>r.kategoriKey===cat.key);
    if(!rows.length) return;
    const header = ['Sumber','NIP/Keterangan','Nama','Jabatan','Unit Kerja', ...cat.fields.map(f=>f.label), 'Catatan','Tanggal Input'];
    const aoa = [header, ...rows.map(r=> [
      r.sumber, r.nip||'', r.nama, r.jabatan||'', r.unit||'',
      ...cat.fields.map(f=> f.type==='date' ? formatTanggalID(r.detail[f.id]) : (r.detail[f.id]||'')),
      r.catatan||'', new Date(r.tanggalInput).toLocaleString('id-ID')
    ])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, cat.sheet.slice(0,31));
  });
  const filename = `Data_Kepegawaian_${todayStamp()}.xlsx`;
  XLSX.writeFile(wb, filename);
  showBanner('rekapBanner','ok', `Berhasil diekspor sebagai ${filename}.`);
}

function exportRekapUtamaPDF(){
  exportTableToPDF('recordsTable', `Data_Kepegawaian_${todayStamp()}.pdf`, 'Rekap Data Kepegawaian');
}

/* =========================================================
   INISIALISASI HALAMAN
   ========================================================= */
async function init(){
  buildNav();
  mainArea.innerHTML =
    panelSumberHTML() +
    CATEGORIES.filter(c=> c.key!=='cuti' && !MONTHLY_RECAP_KEYS.includes(c.key)).map(panelCategoryHTML).join('') +
    CATEGORIES.filter(c=> MONTHLY_RECAP_KEYS.includes(c.key)).map(panelCategoryWithMonthlyRekapHTML).join('') +
    panelCutiHTML() +
    panelRekapHTML() +
    panelPengaturanHTML();

  state.employees = await Store.get('employees', []);
  state.records = await Store.get('records', []);
  populateSuggestionDatalists();
  state.settings = await Store.get('settings', { webAppUrl:'', sheetPegawai:'Sheet1' });
  state.bidangList = await Store.get('bidangList', []);
  state.sisaCutiList = await Store.get('sisaCutiList', []);

  document.getElementById('inpWebAppUrl').value = state.settings.webAppUrl || '';
  document.getElementById('inpSheetPegawai').value = state.settings.sheetPegawai || 'Pegawai';
  renderEmployeeSummary();

  document.getElementById('btnFetchPegawai').addEventListener('click', fetchPegawaiFromGoogle);
  document.getElementById('inpFileExcel').addEventListener('change', (e)=>{
    if(e.target.files[0]) handleExcelFile(e.target.files[0]);
  });
  document.getElementById('btnUseMapping').addEventListener('click', confirmMapping);
  document.getElementById('btnCancelMapping').addEventListener('click', ()=>{
    document.getElementById('mappingCard').style.display='none';
    state.rawImport = null;
  });
  document.getElementById('testSearchEmployee').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const list = q ? state.employees.filter(x=> x.nama.toLowerCase().includes(q) || (x.nip||'').toLowerCase().includes(q)) : state.employees.slice(0,50);
    renderEmployeeTable(list.slice(0,50));
  });

  CATEGORIES.filter(c=>c.key!=='cuti').forEach(cat=>{
    state.selectedEmployee[cat.key] = null;
    wireCategoryPanel(cat);
    if(MONTHLY_RECAP_KEYS.includes(cat.key)) wireMonthlyRekap(cat);
  });
  wireCutiPanel();

  document.getElementById('filterKategori').addEventListener('change', renderRecordsTable);
  document.getElementById('filterSearch').addEventListener('input', renderRecordsTable);
  document.getElementById('btnExportExcel').addEventListener('click', exportToExcel);
  document.getElementById('btnExportPDF').addEventListener('click', exportRekapUtamaPDF);
  document.getElementById('btnRefreshSheets').addEventListener('click', refreshFromSheetsAndRender);

  document.getElementById('btnSaveSettings').addEventListener('click', async ()=>{
    state.settings = {
      webAppUrl: document.getElementById('inpWebAppUrl').value.trim(),
      sheetPegawai: document.getElementById('inpSheetPegawai') ? document.getElementById('inpSheetPegawai').value.trim() : 'Sheet1'
    };
    Store.set('settings', state.settings);
    showBanner('settingsBanner','ok','Pengaturan tersimpan. Memuat data realtime...');
    await bootstrapRealtimeData();
  });
  document.getElementById('btnTestConn').addEventListener('click', async ()=>{
    const url = state.settings.webAppUrl || document.getElementById('inpWebAppUrl').value.trim();
    if(!url){ showBanner('settingsBanner','warn','Isi URL Web App terlebih dahulu.'); return; }
    showBanner('settingsBanner','info','Menguji koneksi...');
    try{
      const res = await fetch(`${url}?action=getPegawai&sheet=${encodeURIComponent(state.settings.sheetPegawai||'Pegawai')}`);
      const json = await res.json();
      if(json.error) showBanner('settingsBanner','warn','Terhubung, tetapi Apps Script mengembalikan error: ' + json.error);
      else showBanner('settingsBanner','ok','Koneksi berhasil! Web App merespons dengan baik.');
    }catch(err){
      showBanner('settingsBanner','warn','Koneksi gagal: ' + err.message);
    }
  });

  showTab('sumber');
  await bootstrapRealtimeData();
  startRealtimePolling();
}

/** Memuat data awal dari Google Sheets (dipanggil saat aplikasi dibuka & saat
 *  URL Web App baru disimpan), lalu me-render ulang tampilan yang aktif. */
async function bootstrapRealtimeData(){
  if(!state.settings.webAppUrl){ updateSyncIndicator('off'); return; }
  await autoLoadEmployeesIfConfigured();
  await refreshFromSheetsAndRender();
}

/** Polling berkala (setiap 25 detik, hanya saat tab terlihat) + refresh
 *  langsung saat tab kembali aktif, agar semua pengguna cepat melihat
 *  perubahan satu sama lain tanpa perlu me-refresh manual. */
function startRealtimePolling(){
  setInterval(()=>{
    if(document.visibilityState === 'visible' && state.settings.webAppUrl){
      refreshFromSheetsAndRender();
    }
  }, 25000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.settings.webAppUrl){
      refreshFromSheetsAndRender();
    }
  });
}

init();
