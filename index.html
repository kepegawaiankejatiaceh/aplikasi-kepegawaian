<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Administrasi Kepegawaian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --ink:#1C2B45;
    --ink-soft:#5A6A85;
    --accent:#A9762F;
    --accent-soft:#EFE4CC;
    --line:#DCD5C4;
    --line-strong:#C7BFA9;
    --success:#3F6B4E;
    --success-soft:#E4EDE6;
    --danger:#8C3B33;
    --danger-soft:#F3E4E1;
    --radius:3px;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
  }
  a{color:var(--accent);}
  header.app-header{
    background:var(--ink);
    color:var(--bg);
    padding:18px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:3px solid var(--accent);
  }
  header.app-header .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  header.app-header h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  header.app-header .subtitle{
    font-size:12.5px;
    color:#C7CEDC;
  }
  header.app-header .sheet-link{
    font-size:12.5px;
    color:var(--bg);
    border:1px solid rgba(255,255,255,0.35);
    padding:6px 12px;
    border-radius:var(--radius);
    text-decoration:none;
    white-space:nowrap;
  }
  header.app-header .sheet-link:hover{
    background:rgba(255,255,255,0.08);
  }
  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:calc(100vh - 68px);
  }
  nav.tabs{
    background:#EFEBE0;
    border-right:1px solid var(--line);
    padding:16px 0;
  }
  nav.tabs .group-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink);
    background:#E4DECC;
    padding:11px 18px;
    margin-top:8px;
    border-left:3px solid var(--accent);
  }
  nav.tabs .group-label.nav-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    cursor:pointer;
    user-select:none;
    font-family:var(--sans);
    border:0;
    border-left:3px solid var(--accent);
    background:#E4DECC;
  }
  nav.tabs .group-label.nav-toggle:hover{ background:#DCD3B8; }
  nav.tabs .group-label.nav-toggle::after{ content:'▾'; font-size:11px; color:var(--ink-soft); }
  nav.tabs .group-label.nav-toggle.collapsed::after{ content:'▸'; }
  nav.tabs button.nav-hidden{ display:none; }
  .report-toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;
    padding:12px; background:#F7F3E9; border:1px solid var(--line);
    margin-bottom:16px;
  }
  .report-toolbar .field{ min-width:150px; }
  .report-toolbar .toggle-row{ margin:0; min-height:38px; }
  .report-meta{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 14px; }
  .dashboard-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;
    margin-bottom:18px;
  }
  .dashboard-card{
    background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent);
    padding:14px; border-radius:var(--radius);
  }
  .dashboard-card .num{font-family:var(--serif);font-size:28px;font-weight:600;}
  .dashboard-card .lbl{font-size:12px;color:var(--ink-soft);}

  nav.tabs button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:3px solid transparent;
    padding:10px 16px 10px 15px;
    font-family:var(--sans);
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  nav.tabs button:hover{
    background:#E4DECC;
  }
  nav.tabs button.active{
    background:var(--surface);
    border-left-color:var(--accent);
    font-weight:600;
  }
  main{
    padding:26px 32px;
    max-width:1080px;
  }
  .panel{
    display:none;
  }
  .panel.active{
    display:block;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    margin:0 0 4px;
  }
  .card .hint{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 16px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 18px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field.full{ grid-column:1 / -1; }
  .field label{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  input[type=text], input[type=date], input[type=number], input[type=url], select, textarea{
    font-family:var(--sans);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .btn{
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{ background:#132038; }
  .btn.secondary{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line-strong);
  }
  .btn.secondary:hover{ background:#F1EEE4; }
  .btn.accent{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.accent:hover{ background:#93641F; }
  .btn.danger{
    background:#fff;
    color:var(--danger);
    border:1px solid var(--danger);
  }
  .btn.danger:hover{ background:var(--danger-soft); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .toggle-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    background:var(--accent-soft);
    border:1px solid #DFCB9F;
    border-radius:var(--radius);
    margin-bottom:16px;
    font-size:13px;
  }
  .toggle-row input{ width:16px; height:16px; }
  .employee-search{ position:relative; }
  .employee-results{
    position:absolute; z-index:5; top:100%; left:0; right:0;
    background:#fff; border:1px solid var(--line-strong); border-top:none;
    max-height:180px; overflow-y:auto;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
  }
  .employee-results div{
    padding:8px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid #F1EEE4;
  }
  .employee-results div:hover{ background:var(--accent-soft); }
  .selected-employee{
    font-size:12.5px; color:var(--success); margin-top:4px;
  }
  table.data-table{
    width:100%; border-collapse:collapse; font-size:13px;
  }
  table.data-table th, table.data-table td{
    border:1px solid var(--line);
    padding:7px 9px;
    text-align:left;
    vertical-align:top;
  }
  table.data-table th{
    background:#EFEBE0;
    font-weight:600;
    font-size:12px;
    color:var(--ink);
  }
  table.data-table tr:nth-child(even) td{ background:#FCFBF8; }
  .badge{
    display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600;
  }
  .badge.synced{ background:var(--success-soft); color:var(--success); }
  .badge.unsynced{ background:var(--danger-soft); color:var(--danger); }
  .filters-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
  .filters-row .field{ min-width:180px; }
  .summary-cards{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .summary-card{
    flex:1; min-width:110px;
    border:1px solid var(--line); border-left:3px solid var(--accent);
    background:#fff; padding:10px 12px; border-radius:var(--radius);
  }
  .summary-card .num{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .summary-card .lbl{ font-size:11.5px; color:var(--ink-soft); }
  .mapping-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid #EFEBE0; }
  .preview-wrap{ overflow-x:auto; margin-top:10px; }
  .subtabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .subtabs button{
    font-family:var(--sans); font-size:13px; font-weight:600;
    padding:7px 14px; border-radius:16px; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .subtabs button:hover{ background:#F1EEE4; }
  .subtabs button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .banner{
    padding:10px 14px; border-radius:var(--radius); font-size:13px; margin-bottom:16px;
  }
  .banner.warn{ background:#FBF2DE; border:1px solid #E7CB8E; color:#6E4E10; }
  .banner.info{ background:#E7EEF5; border:1px solid #B9CBDE; color:#254165; }
  .banner.ok{ background:var(--success-soft); border:1px solid #B9D2C0; color:var(--success); }
  .empty-state{ padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:13.5px; }
  code.inline{ background:#EFEBE0; padding:1px 5px; border-radius:3px; font-size:12px; }
  footer.app-footer{ text-align:center; padding:16px; font-size:11.5px; color:var(--ink-soft); }
  @media (max-width: 820px){
    .layout{ grid-template-columns:1fr; }
    nav.tabs{ display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); padding:8px; }
    nav.tabs button{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    nav.tabs button.active{ border-bottom-color:var(--accent); }
    .field-grid{ grid-template-columns:1fr; }
    main{ padding:18px; }
  }

/* ===== Dashboard Profesional ===== */
.dashboard-shell{display:flex;flex-direction:column;gap:18px}
.dashboard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.dashboard-title{margin:0;font-size:25px;letter-spacing:-.02em}
.dashboard-subtitle{margin:6px 0 0;color:var(--ink-soft);font-size:13px;line-height:1.55}
.dashboard-filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px;background:linear-gradient(135deg,#f8fafc,#fff);border:1px solid var(--line);border-radius:14px}
.dashboard-filters .field{min-width:145px}
.dashboard-filters .field label{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.dashboard-filter-acc{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px}
.dashboard-filter-acc input{accent-color:var(--primary)}
.dashboard-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dashboard-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.dashboard-kpi:after{content:"";position:absolute;right:-25px;top:-25px;width:80px;height:80px;border-radius:50%;background:rgba(59,130,246,.06)}
.dashboard-kpi .kpi-label{font-size:12px;color:var(--ink-soft);font-weight:600}
.dashboard-kpi .kpi-value{font-size:28px;font-weight:800;margin-top:5px;letter-spacing:-.03em}
.dashboard-kpi .kpi-note{font-size:11px;color:var(--ink-soft);margin-top:3px}
.dashboard-charts{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.dashboard-chart-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 5px 18px rgba(15,23,42,.045)}
.dashboard-chart-card.full{grid-column:1/-1}
.chart-title{font-weight:750;font-size:14px;margin-bottom:2px}
.chart-note{font-size:11px;color:var(--ink-soft);margin-bottom:12px}
.chart-svg{width:100%;height:270px;display:block}
.category-chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.category-chart{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fcfdff}
.category-chart .cat-name{font-size:13px;font-weight:700;margin-bottom:8px}
.category-chart .cat-total{font-size:11px;color:var(--ink-soft);margin-top:6px}
.mini-svg{width:100%;height:120px;display:block}
.dashboard-empty{padding:28px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:12px;background:#fafafa}
.dashboard-table-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 5px 18px rgba(15,23,42,.045)}
@media(max-width:900px){.dashboard-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-charts{grid-template-columns:1fr}.category-chart-grid{grid-template-columns:1fr}}
@media(max-width:560px){.dashboard-kpis{grid-template-columns:1fr}.dashboard-filters .field{min-width:100%}.dashboard-filter-acc{width:100%}}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <h1>Administrasi Kepegawaian</h1>
    <div class="subtitle">Pencatatan izin, diklat, magang, ujian kompetensi &amp; hukuman disiplin</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">

</header>

<div class="layout">

  </main>
</div>

<footer class="app-footer">Mode realtime aktif &middot; data tersimpan &amp; terbaca langsung dari Google Sheets, sama di perangkat mana pun.</footer>

/* =========================================================
   PENYIMPANAN
   Urutan prioritas:
   1) window.storage  -> tersedia saat aplikasi dibuka dari dalam Claude
   2) localStorage    -> tersedia saat file ini dibuka langsung di browser
                         (data tersimpan permanen di browser tsb, tidak perlu isi ulang)
   3) memori sementara -> cadangan terakhir jika keduanya diblokir browser
   ========================================================= */
const HAS_APP_STORAGE = (typeof window.storage !== 'undefined' && window.storage);
const HAS_LOCAL_STORAGE = (() => {
  try { const k='__test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
const memoryFallback = {};
const STORE_PREFIX = 'kepegawaian_';

const Store = {
  async get(key, fallback){
    if(HAS_APP_STORAGE){
      try{
        const r = await window.storage.get(key);
        if(r) return JSON.parse(r.value);
      }catch(e){ /* lanjut ke fallback di bawah */ }
    }
    if(HAS_LOCAL_STORAGE){
      try{
        const raw = localStorage.getItem(STORE_PREFIX + key);
        if(raw != null) return JSON.parse(raw);
      }catch(e){ /* lanjut ke memori */ }
    }
    return (key in memoryFallback) ? memoryFallback[key] : fallback;
  },
  async set(key, value){
    memoryFallback[key] = value; // selalu simpan juga di memori untuk sesi berjalan
    if(HAS_APP_STORAGE){
      try{ await window.storage.set(key, JSON.stringify(value)); }
      catch(e){ console.error('Gagal menyimpan ke window.storage', key, e); }
    }
    if(HAS_LOCAL_STORAGE){
      try{ localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); }
      catch(e){ console.error('Gagal menyimpan ke localStorage', key, e); }
    }
  }
};
const HAS_STORAGE = HAS_APP_STORAGE || HAS_LOCAL_STORAGE;

function buildNav(){
  tabNav.innerHTML = '';
  const addLabel = (t, group, collapsed=false)=>{
    const d=document.createElement('div');
    d.className='group-label nav-toggle' + (collapsed?' collapsed':'');
    d.dataset.navGroup=group;
    d.innerHTML = `<span>${t}</span>`;
    tabNav.appendChild(d);
  };
  const addBtn = (tab,label,group,hidden=false)=>{
    const b=document.createElement('button');
    b.dataset.tab=tab; b.dataset.navGroup=group; b.textContent=label;
    if(hidden) b.classList.add('nav-hidden');
    tabNav.appendChild(b);
  };

  addBtn('dashboard','Dashboard','dashboard');

      toggle.classList.toggle('collapsed');
      tabNav.querySelectorAll(`button[data-nav-group="${group}"]`).forEach(b=>b.classList.toggle('nav-hidden'));

/** Jenis kelamin dihitung dari karakter ke-15 NIP (bukan dari kolom terpisah) —
 *  logika identik dengan Aplikasi Pencarian Pegawai (SIMKARI): karakter '2' atau
 *  '4' berarti Perempuan, selain itu Laki-laki. NIP yang berformat "NIP / NRP"
 *  diambil bagian sebelum tanda '/' saja. */
function parseGenderFromNip(nipRaw){
  const clean = (nipRaw||'').toString().replace(/'/g,'').replace(/\s/g,'').trim();
  const nipOnly = clean.split('/')[0];
  if(!nipOnly || nipOnly.length < 15) return 'L'; // default aman jika NIP bermasalah
  const jkChar = nipOnly.charAt(14);
  return (jkChar === '2' || jkChar === '4') ? 'P' : 'L';
}
/** Jaksa vs Tata Usaha ditentukan dari teks Golongan/Pangkat yang mengandung
 *  kata "jaksa" — logika identik dengan SIMKARI (isJaksaGol). */
function isJaksaGol(golRaw){
  return (golRaw||'').toString().toLowerCase().includes('jaksa');
}

function guessColumn(header, guesses){
  const h = header.toLowerCase();
  return guesses.some(g=> h.includes(g));
}

/* =========================================================
   SINKRONISASI REALTIME DENGAN GOOGLE SHEETS
   Google Sheets diperlakukan sebagai satu-satunya sumber data.
   Setiap simpan/ubah/hapus langsung dikirim (POST), dan setiap
   buka/refresh langsung membaca ulang (GET) dari Sheets.
   ========================================================= */
function updateSyncIndicator(status){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  const now = new Date().toLocaleTimeString('id-ID');
  if(status === 'ok') el.innerHTML = `<span style="color:var(--success);">&#9679;</span> Realtime aktif &middot; terakhir diperbarui ${now}`;
  else if(status === 'syncing') el.innerHTML = `<span style="color:var(--accent);">&#9679;</span> Menyinkronkan...`;
  else if(status === 'off') el.innerHTML = `<span style="color:var(--ink-soft);">&#9679;</span> Realtime nonaktif — atur URL Web App di tab Pengaturan`;
  else el.innerHTML = `<span style="color:var(--danger);">&#9679;</span> Gagal terhubung ke Google Sheets &middot; menampilkan data tersimpan lokal terakhir`;
}

async function apiPost(body){
  const url = state.settings.webAppUrl;
  if(!url) return { error: 'URL Web App belum diatur.' };
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // hindari preflight CORS pada Apps Script
      body: JSON.stringify(body)
    });
    return await res.json();
  }catch(err){
    return { error: err.message };
  }
}

/** Menyamakan berbagai variasi penulisan Bidang (huruf besar/kecil, singkatan,
 *  dari file Excel atau ketikan manual di spreadsheet) ke salah satu dari 10
 *  pilihan Bidang baku pada aplikasi. Jika tidak dikenali, teks asli dipakai
 *  apa adanya (supaya tidak menghilangkan data). */
function normalizeBidang(raw){
  if(!raw) return '';
  const s = String(raw).trim().toLowerCase();
  const exact = BIDANG_OPTIONS.find(o=> o.toLowerCase() === s);
  if(exact) return exact;
  const rules = [
    { keys:['eselon'], value:'Eselon II dan III' },
    { keys:['pembinaan'], value:'Pembinaan' },
    { keys:['intel'], value:'Intel' },
    { keys:['pidsus'], value:'Pidsus' },
    { keys:['pidum'], value:'Pidum' },
    { keys:['datun'], value:'Datun' },
    { keys:['pidmil'], value:'Pidmil' },
    { keys:['aset','asset'], value:'Aset' },
    { keys:['pengawasan'], value:'Pengawasan' },
    { keys:['tata usaha'], value:'Tata Usaha' },
  ];
  const found = rules.find(r=> r.keys.some(k=> s.includes(k)));
  return found ? found.value : String(raw).trim();
}

async function fetchBidangFromSheets(){
  const url = state.settings.webAppUrl;
  if(!url) return false;
  try{
    const res = await fetch(`${url}?action=getBidang`);
    const json = await res.json();
    if(json.error) return false;
    let changed = false;
    const normalized = (json.items || []).map(it=>{
      const clean = normalizeBidang(it.bidang);
      if(clean !== it.bidang) changed = true;
      return { ...it, bidang: clean };
    });
    state.bidangList = normalized;
    Store.set('bidangList', state.bidangList);
    if(changed) pushBidangToSheets(true); // rapikan otomatis penulisan Bidang yang belum baku di spreadsheet
    return true;
  }catch(err){ return false; }
}

/** Menghitung rekap 9 kolom (Satuan Kerja, Laki-laki, Perempuan, Jaksa Lk,
 *  Jaksa Pr, TU Lk, TU Pr, Total) dari Data Pegawai Termuat saat ini — memakai
 *  logika Jenis Kelamin (dari NIP) & Jaksa/TU (dari Golongan) yang identik
 *  dengan Aplikasi Pencarian Pegawai (SIMKARI). */
function computeRekapPegawaiPerSatker(employees){
  const rekap = {};
  employees.forEach(e=>{
    const satker = e.unit || 'Lainnya';
    if(!rekap[satker]) rekap[satker] = { laki:0, perempuan:0, jaksaLk:0, jaksaPr:0, tuLk:0, tuPr:0 };
    const jk = parseGenderFromNip(e.nip);
    const jaksa = isJaksaGol(e.golongan);
    if(jk === 'L'){ rekap[satker].laki++; if(jaksa) rekap[satker].jaksaLk++; else rekap[satker].tuLk++; }
    else { rekap[satker].perempuan++; if(jaksa) rekap[satker].jaksaPr++; else rekap[satker].tuPr++; }
  });
  return Object.keys(rekap).sort().map(satker=>{
    const r = rekap[satker];
    return { satker, laki:r.laki, perempuan:r.perempuan, jaksaLk:r.jaksaLk, jaksaPr:r.jaksaPr, tuLk:r.tuLk, tuPr:r.tuPr, total:r.laki+r.perempuan };
  });
}

async function refreshFromSheetsAndRender(){

function handleExcelFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(e.target.result, { type:'binary' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(!aoa.length){ showBanner('sumberBanner','warn','File kosong.'); return; }
    handleRawImport(aoa[0], aoa.slice(1));
  };
  reader.readAsBinaryString(file);
}

/** Coba tebak pemetaan kolom otomatis dari header. Mengembalikan mapping bila
 *  NIP & Nama berhasil ditebak dengan jelas, atau null bila ambigu/tidak ditemukan. */
function tryAutoMapping(headers){
  const mapping = {};
  STANDARD_FIELDS.forEach(f=>{
    mapping[f.key] = headers.findIndex(h=> guessColumn(String(h||''), f.guess));
  });
  if(mapping.nip < 0 || mapping.nama < 0) return null;
  return mapping;
}

/** Dipanggil otomatis saat aplikasi dibuka (bila URL Web App & nama sheet sudah diatur).
 *  Jika kolom NIP & Nama bisa ditebak otomatis, data pegawai langsung dimuat tanpa
 *  perlu konfirmasi manual, supaya siapa pun yang membuka aplikasi langsung siap pakai. */
async function autoLoadEmployeesIfConfigured(){
  const url = state.settings.webAppUrl;
  const sheetName = state.settings.sheetPegawai || 'Sheet1';
  if(!url) return;
  try{
    const res = await fetch(`${url}?action=getPegawai&sheet=${encodeURIComponent(sheetName)}`);
    const json = await res.json();
    if(json.error || !json.data || !json.data.length) return;
    const headers = json.data[0];
    const rows = json.data.slice(1);
    const mapping = tryAutoMapping(headers);
    if(!mapping){
      // ambigu -> biarkan seperti semula, tampilkan kartu pencocokan manual
      handleRawImport(headers, rows);
      showBanner('sumberBanner','warn','Kolom NIP/Nama tidak dapat ditebak otomatis. Silakan cocokkan manual di bawah.');
      return;
    }
    const employees = rows
      .filter(r=> r && r.some(c=> c !== '' && c != null))
      .map(r=>({
        nip: mapping.nip>=0 ? String(r[mapping.nip] ?? '').trim() : '',
        nama: mapping.nama>=0 ? String(r[mapping.nama] ?? '').trim() : '',
        jabatan: mapping.jabatan>=0 ? String(r[mapping.jabatan] ?? '').trim() : '',
        unit: mapping.unit>=0 ? String(r[mapping.unit] ?? '').trim() : '',
        golongan: mapping.golongan>=0 ? String(r[mapping.golongan] ?? '').trim() : '',
      }))
      .filter(e=> e.nama);
    state.employees = employees;
    Store.set('employees', employees);
    renderEmployeeSummary();
    showBanner('sumberBanner','ok', `${employees.length} data pegawai otomatis dimuat dari spreadsheet sumber.`);
  }catch(err){
    // gagal diam-diam saat auto-load; tombol manual tetap tersedia
  }
}

/** Saran ketik-otomatis untuk kolom input manual (Nama, NIP/Keterangan, Jabatan,
 *  Unit Kerja) yang muncul identik di setiap kategori. Nilainya dikumpulkan dari
 *  SEMUA kategori sekaligus (top-level nama/nip/jabatan/unit tiap data), lalu
 *  diterapkan ke datalist milik setiap kategori (id-nya diberi akhiran per kategori
 *  supaya tidak bentrok, tapi isinya sama/dibagi bersama). */
const MANUAL_SUGGESTION_KEYS = ['manualNama','manualNip','manualJabatan','manualUnit'];
function populateManualSuggestionDatalists(){
  const pools = {
    manualNama: new Set(), manualNip: new Set(), manualJabatan: new Set(), manualUnit: new Set(),
  };
  state.records.forEach(r=>{
    if(r.nama) pools.manualNama.add(r.nama);
    if(r.nip) pools.manualNip.add(r.nip);
    if(r.jabatan) pools.manualJabatan.add(r.jabatan);
    if(r.unit) pools.manualUnit.add(r.unit);
  });
  const allCatKeys = CATEGORIES.map(c=> c.key);
  MANUAL_SUGGESTION_KEYS.forEach(key=>{
    const options = Array.from(pools[key]).sort((a,b)=> String(a).localeCompare(String(b)))
      .map(v=>`<option value="${String(v).replace(/"/g,'&quot;')}"></option>`).join('');
    allCatKeys.forEach(catKey=>{
      const dl = document.getElementById(`dl_${key}_${catKey}`);
      if(dl) dl.innerHTML = options;
    });
  });
}

function wireCategoryPanel(cat){
  const manualCheckbox = document.getElementById(`manual_${cat.key}`);
  manualCheckbox.addEventListener('change', ()=>{
    document.getElementById(`pegawaiPicker_${cat.key}`).style.display = manualCheckbox.checked ? 'none' : 'block';
    document.getElementById(`manualFields_${cat.key}`).style.display = manualCheckbox.checked ? 'block' : 'none';
    state.selectedEmployee[cat.key] = null;
  });

  const searchInput = document.getElementById(`search_${cat.key}`);
  const resultsBox = document.getElementById(`results_${cat.key}`);
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    if(q.length < 2){ resultsBox.style.display='none'; return; }
    const matches = state.employees.filter(e=>
      (e.nama||'').toLowerCase().includes(q) || (e.nip||'').toLowerCase().includes(q)
    ).slice(0,15);
    if(!matches.length){ resultsBox.innerHTML = '<div>Tidak ditemukan</div>'; resultsBox.style.display='block'; return; }
    resultsBox.innerHTML = matches.map((e,i)=>`<div data-idx="${i}">${e.nama} — ${e.nip||'tanpa NIP'} <span style="color:var(--ink-soft)">(${e.jabatan||'-'})</span></div>`).join('');
    resultsBox.style.display = 'block';
    resultsBox.querySelectorAll('div[data-idx]').forEach(div=>{
      div.addEventListener('click', ()=>{
        const emp = matches[parseInt(div.dataset.idx,10)];
        state.selectedEmployee[cat.key] = emp;
        document.getElementById(`selected_${cat.key}`).textContent = `Terpilih: ${emp.nama} (${emp.nip||'-'})`;
        searchInput.value = emp.nama;
        resultsBox.style.display = 'none';
      });
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest(`#pegawaiPicker_${cat.key}`)) resultsBox.style.display='none';
  });

  document.querySelector(`[data-save="${cat.key}"]`).addEventListener('click', ()=> saveRecord(cat));
  document.querySelector(`[data-reset="${cat.key}"]`).addEventListener('click', ()=> resetCategoryForm(cat));
}

function resetCategoryForm(cat){

  cat.fields.forEach(f=> document.getElementById(`f_${cat.key}_${f.id}`).value = '');
  document.getElementById(`catatan_${cat.key}`).value = '';
  state.selectedEmployee[cat.key] = null;
  document.getElementById(`formBanner_${cat.key}`).innerHTML = '';
}

async function saveRecord(cat){
  const isManual = document.getElementById(`manual_${cat.key}`).checked;
  let nama, nip, jabatan, unit, sumber;
  if(isManual){
    nama = document.getElementById(`manualNama_${cat.key}`).value.trim();
    nip = document.getElementById(`manualNip_${cat.key}`).value.trim();
    jabatan = document.getElementById(`manualJabatan_${cat.key}`).value.trim();
    unit = document.getElementById(`manualUnit_${cat.key}`).value.trim();
    sumber = 'Manual';
  } else {
    const emp = state.selectedEmployee[cat.key];
    if(!emp){ showBanner(`formBanner_${cat.key}`,'warn','Pilih pegawai terlebih dahulu, atau centang input manual.'); return; }
    nama = emp.nama; nip = emp.nip; jabatan = emp.jabatan; unit = emp.unit;
    sumber = 'Data Pegawai';
  }
  if(!nama){ showBanner(`formBanner_${cat.key}`,'warn','Nama wajib diisi.'); return; }
  if(!state.settings.webAppUrl){ showBanner(`formBanner_${cat.key}`,'warn','URL Web App belum diatur — buka tab Pengaturan terlebih dahulu agar data bisa tersimpan realtime.'); return; }

  const detail = {};
  cat.fields.forEach(f=> detail[f.id] = document.getElementById(`f_${cat.key}_${f.id}`).value);

  const record = {
    id: genId(),
    kategoriKey: cat.key,
    kategoriLabel: cat.label,
    sheet: cat.sheet,
    sumber, nama, nip, jabatan, unit,
    detail,
    catatan: document.getElementById(`catatan_${cat.key}`).value.trim(),
    tanggalInput: new Date().toISOString(),
  };

  const btn = document.querySelector(`[data-save="${cat.key}"]`);
  btn.disabled = true;
  showBanner(`formBanner_${cat.key}`,'info','Menyimpan ke Google Sheets...');
  const ok = await pushRecordToSheets(record);
  btn.disabled = false;
  if(!ok){
    showBanner(`formBanner_${cat.key}`,'warn','Gagal menyimpan ke Google Sheets. Periksa koneksi internet Anda, lalu coba lagi. Data belum tersimpan.');
    return;
  }
  await fetchAllRecordsFromSheets();
  showBanner(`formBanner_${cat.key}`,'ok', `Data ${cat.label} untuk ${nama} berhasil disimpan.`);
  resetCategoryForm(cat);
  if(MONTHLY_RECAP_KEYS.includes(cat.key)) renderMonthlyRekap(cat, true);
}

/* =========================================================

   Periode rekap mengacu pada Tanggal Persetujuan Pimpinan.
   ========================================================= */
const BULAN_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function monthKeyFromDate(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabelFromKey(monthKey){
  const [y,m] = monthKey.split('-');
  return `${BULAN_NAMES[parseInt(m,10)-1]} ${y}`;
}

function wireMonthlyRekap(cat){
  wireSimpleSubtabs(`subTabs_${cat.key}`, {
    permohonan: `sub-${cat.key}-permohonan`,
    rekap: `sub-${cat.key}-rekap`,
  }, (key)=>{ if(key==='rekap') renderMonthlyRekap(cat, true); });

  document.getElementById(`filterBulan_${cat.key}`).addEventListener('change', ()=> renderMonthlyRekap(cat, false));
  document.querySelector(`[data-export-excel="${cat.key}"]`).addEventListener('click', ()=> exportMonthlyRekapExcel(cat));
  document.querySelector(`[data-export-pdf="${cat.key}"]`).addEventListener('click', ()=> exportMonthlyRekapPDF(cat));
}

function renderMonthlyRekap(cat, rebuildOptions){
  const records = state.records.filter(r=> r.kategoriKey === cat.key);
  const select = document.getElementById(`filterBulan_${cat.key}`);
  if(!select) return;
  if(rebuildOptions){
    const months = Array.from(new Set(records.map(r=> monthKeyFromDate(r.detail.tglPersetujuanPimpinan)).filter(Boolean))).sort().reverse();
    const current = select.value;
    select.innerHTML = '<option value="">Semua Bulan</option>' + months.map(m=>`<option value="${m}" ${m===current?'selected':''}>${monthLabelFromKey(m)}</option>`).join('');
  }
  const filterMonth = select.value;
  const list = records.filter(r=> !filterMonth || monthKeyFromDate(r.detail.tglPersetujuanPimpinan) === filterMonth);
  const table = document.getElementById(`rekapTable_${cat.key}`);
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Tidak ada data pada periode ini.</td></tr>'; return; }
  table.innerHTML = '<tr><th>Nama</th><th>NIP/Ket.</th><th>Tgl Pengajuan Pegawai</th><th>Tgl Persetujuan Pimpinan</th><th>Nomor Surat</th><th>Status KEP</th><th>Nomor KEP</th><th>Tanggal KEP</th></tr>' +
    list.slice().sort((a,b)=> (b.detail.tglPersetujuanPimpinan||'').localeCompare(a.detail.tglPersetujuanPimpinan||'')).map(r=>`<tr>
      <td>${r.nama}</td><td>${r.nip||'-'}</td>
      <td>${formatTanggalID(r.detail.tglPengajuanPegawai)}</td><td>${formatTanggalID(r.detail.tglPersetujuanPimpinan)}</td>
      <td>${r.detail.nomorSurat||'-'}</td><td>${r.detail.statusKep||'-'}</td>
      <td>${r.detail.nomorKep||'-'}</td><td>${formatTanggalID(r.detail.tanggalKep)}</td>
    </tr>`).join('');
}
function exportMonthlyRekapExcel(cat){ exportTableToExcel(`rekapTable_${cat.key}`, `Rekap_${cat.sheet.replace(/\s+/g,'_')}_${todayStamp()}.xlsx`, cat.label); }
function exportMonthlyRekapPDF(cat){ exportTableToPDF(`rekapTable_${cat.key}`, `Rekap_${cat.sheet.replace(/\s+/g,'_')}_${todayStamp()}.pdf`, `Rekap ${cat.label}`); }

/* ---------- Helper Sisa Cuti & Bidang ---------- */
function findBidang(nip){
  const e = state.bidangList.find(b=> b.nip === nip);
  return e ? e.bidang : '';
}
function findSisaCuti(nip){
  return state.sisaCutiList.find(s=> s.nip === nip) || null;
}
function sisaCutiText(nip){
  const s = findSisaCuti(nip);
  if(!s) return 'Data sisa cuti belum tersedia. Sinkronkan pada Pengaturan &rarr; Sisa Cuti.';
  return `Tahun Berjalan: ${s.berjalan} hari &middot; 1 Tahun Sebelumnya: ${s.tahunLalu} hari &middot; 2 Tahun Sebelumnya: ${s.duaTahunLalu} hari`;
}
function mergeEmployeesIntoBidang(){
  let added = 0;
  state.employees.forEach(e=>{
    if(!e.nip) return;
    const existing = state.bidangList.find(b=> b.nip === e.nip);
    if(existing){ existing.nama = e.nama || existing.nama; }
    else { state.bidangList.push({ nip:e.nip, nama:e.nama, bidang:'' }); added++; }
  });
  Store.set('bidangList', state.bidangList);
  return added;
}
function mergeEmployeesIntoSisaCuti(){
  let added = 0;
  state.employees.forEach(e=>{
    if(!e.nip) return;
    const existing = state.sisaCutiList.find(s=> s.nip === e.nip);
    if(existing){ existing.nama = e.nama || existing.nama; }
    else { state.sisaCutiList.push({ nip:e.nip, nama:e.nama, berjalan:12, tahunLalu:6, duaTahunLalu:6 }); added++; }
  });
  Store.set('sisaCutiList', state.sisaCutiList);
  return added;
}
function deductSisaCuti(nip, jumlahHari, checks){
  const s = findSisaCuti(nip);
  const breakdown = { duaTahunLalu:0, tahunLalu:0, berjalan:0 };
  if(!s || !jumlahHari) return breakdown;
  let remaining = jumlahHari;
  [
    { key:'duaTahunLalu', on:checks.duaTahunLalu },
    { key:'tahunLalu', on:checks.tahunLalu },
    { key:'berjalan', on:checks.berjalan },
  ].forEach(o=>{
    if(!o.on || remaining <= 0) return;
    const take = Math.min(s[o.key], remaining);
    s[o.key] -= take;
    breakdown[o.key] = take;
    remaining -= take;
  });
  Store.set('sisaCutiList', state.sisaCutiList);
  return breakdown;
}
function restoreSisaCuti(nip, breakdown){
  const s = findSisaCuti(nip);
  if(!s || !breakdown) return;
  s.duaTahunLalu += breakdown.duaTahunLalu || 0;
  s.tahunLalu += breakdown.tahunLalu || 0;
  s.berjalan += breakdown.berjalan || 0;
  Store.set('sisaCutiList', state.sisaCutiList);
}
function allCutiRecords(){
  return state.records.filter(r=> r.kategoriKey === 'cuti');
}
function isCutiSedangBerjalanTanggal(r){
  const today = new Date(); today.setHours(0,0,0,0);
  const mulai = r.detail.tglMulai ? new Date(r.detail.tglMulai) : null;
  const selesai = r.detail.tglSelesai ? new Date(r.detail.tglSelesai) : null;
  if(!mulai || !selesai) return false;
  return today >= mulai && today <= selesai;
}

/** Menampilkan tanggal dalam format DD-MM-YYYY, apa pun bentuk aslinya
 *  (baik "2026-08-31" maupun "2026-08-31T17:00:00.000Z"). */
function formatTanggalID(value){
  if(!value) return '-';
  const s = String(value);
  const datePart = s.length >= 10 ? s.slice(0,10) : s;
  const parts = datePart.split('-');
  if(parts.length === 3 && parts[0].length === 4){
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }
  return s;
}

/* ---------- Sub-tab switching (generik) ---------- */
function wireSimpleSubtabs(navId, panels, onShow){
  const nav = document.getElementById(navId);
  nav.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-key]');
    if(!btn) return;
    nav.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b===btn));
    Object.entries(panels).forEach(([key, elId])=>{
      document.getElementById(elId).style.display = (key===btn.dataset.key) ? 'block':'none';
    });
    if(onShow) onShow(btn.dataset.key);
  });
}

function wireCutiPermohonan(){
  const manualCheckbox = document.getElementById('manual_cuti');
  manualCheckbox.addEventListener('change', ()=>{
    document.getElementById('pegawaiPicker_cuti').style.display = manualCheckbox.checked ? 'none' : 'block';
    document.getElementById('manualFields_cuti').style.display = manualCheckbox.checked ? 'block' : 'none';
    state.cutiSelected = null;
    document.getElementById('sisaCutiInfo_cuti').innerHTML = '';
  });

  const searchInput = document.getElementById('search_cuti');
  const resultsBox = document.getElementById('results_cuti');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    if(q.length < 2){ resultsBox.style.display='none'; return; }
    const matches = state.employees.filter(e=>
      (e.nama||'').toLowerCase().includes(q) || (e.nip||'').toLowerCase().includes(q)
    ).slice(0,15);
    if(!matches.length){ resultsBox.innerHTML = '<div>Tidak ditemukan</div>'; resultsBox.style.display='block'; return; }
    resultsBox.innerHTML = matches.map((e,i)=>`<div data-idx="${i}">${e.nama} — ${e.nip||'tanpa NIP'} <span style="color:var(--ink-soft)">(${e.jabatan||'-'})</span></div>`).join('');
    resultsBox.style.display = 'block';
    resultsBox.querySelectorAll('div[data-idx]').forEach(div=>{
      div.addEventListener('click', ()=>{
        const emp = matches[parseInt(div.dataset.idx,10)];
        state.cutiSelected = emp;
        document.getElementById('selected_cuti').textContent = `Terpilih: ${emp.nama} (${emp.nip||'-'})`;
        searchInput.value = emp.nama;
        resultsBox.style.display = 'none';
        document.getElementById('bidang_cuti').value = findBidang(emp.nip);
        showBanner('sisaCutiInfo_cuti', findSisaCuti(emp.nip) ? 'info' : 'warn', 'Sisa Cuti — ' + sisaCutiText(emp.nip));
      });
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#pegawaiPicker_cuti')) resultsBox.style.display='none';
  });

  document.getElementById('btnSaveCuti').addEventListener('click', saveCutiRecord);

}

async function saveCutiRecord(){
  const isManual = document.getElementById('manual_cuti').checked;
  let nama, nip, jabatan, unit, sumber, bidang;
  if(isManual){
    nama = document.getElementById('manualNama_cuti').value.trim();
    nip = document.getElementById('manualNip_cuti').value.trim();
    jabatan = document.getElementById('manualJabatan_cuti').value.trim();
    unit = document.getElementById('manualUnit_cuti').value.trim();
    bidang = document.getElementById('bidangManual_cuti').value;
    sumber = 'Manual';
  } else {
    const emp = state.cutiSelected;
    if(!emp){ showBanner('formBanner_cuti','warn','Pilih pegawai terlebih dahulu, atau centang input manual.'); return; }
    nama = emp.nama; nip = emp.nip; jabatan = emp.jabatan; unit = emp.unit;
    bidang = document.getElementById('bidang_cuti').value; // dropdown selalu jadi acuan akhir, walau berbeda dari default
    sumber = 'Data Pegawai';
  }
  if(!nama){ showBanner('formBanner_cuti','warn','Nama wajib diisi.'); return; }
  if(!bidang){ showBanner('formBanner_cuti','warn','Pilih Bidang terlebih dahulu.'); return; }
  if(!state.settings.webAppUrl){ showBanner('formBanner_cuti','warn','URL Web App belum diatur — buka tab Pengaturan terlebih dahulu agar data bisa tersimpan realtime.'); return; }

  const jumlahHari = parseFloat(document.getElementById('f_cuti_jumlahHari').value) || 0;
  const checks = {
    berjalan: document.getElementById('chkBerjalan_cuti').checked,
    tahunLalu: document.getElementById('chkTahunLalu_cuti').checked,
    duaTahunLalu: document.getElementById('chkDuaTahunLalu_cuti').checked,
  };
  const statusAwal = document.getElementById('statusAwal_cuti').value;

  const detail = {
    jenisCuti: document.getElementById('f_cuti_jenisCuti').value,
    tglMulai: document.getElementById('f_cuti_tglMulai').value,
    tglSelesai: document.getElementById('f_cuti_tglSelesai').value,
    jumlahHari: document.getElementById('f_cuti_jumlahHari').value,
    alasan: document.getElementById('f_cuti_alasan').value,
    nomorSurat: document.getElementById('f_cuti_nomorSurat').value,
    pejabat: document.getElementById('f_cuti_pejabat').value,
    bidang,
    tahunBerjalan: checks.berjalan ? 'Ya' : 'Tidak',
    tahunLalu: checks.tahunLalu ? 'Ya' : 'Tidak',
    duaTahunLalu: checks.duaTahunLalu ? 'Ya' : 'Tidak',
    statusAwal,
    statusCuti: statusAwal,
    potongBerjalanHari: 0, potongTahunLaluHari: 0, potongDuaTahunLaluHari: 0,
    sudahDipotong: 'Tidak',
  };

  let breakdown = { berjalan:0, tahunLalu:0, duaTahunLalu:0 };
  let deducted = false;
  if(CUTI_DEDUCTING_STATUSES.includes(statusAwal)){
    breakdown = deductSisaCuti(nip, jumlahHari, checks); // memotong di salinan lokal state.sisaCutiList
    deducted = true;
    detail.potongBerjalanHari = breakdown.berjalan;
    detail.potongTahunLaluHari = breakdown.tahunLalu;
    detail.potongDuaTahunLaluHari = breakdown.duaTahunLalu;
    detail.sudahDipotong = 'Ya';
  }

  const record = {
    id: genId(), kategoriKey:'cuti', kategoriLabel:'Izin Cuti', sheet:'Izin Cuti',
    sumber, nama, nip, jabatan, unit, detail,
    catatan: document.getElementById('catatan_cuti').value.trim(),
    tanggalInput: new Date().toISOString(),
  };

  const btn = document.getElementById('btnSaveCuti');
  btn.disabled = true;
  showBanner('formBanner_cuti','info','Menyimpan ke Google Sheets...');
  const okRecord = await pushRecordToSheets(record);
  if(!okRecord){
    btn.disabled = false;
    if(deducted) restoreSisaCuti(nip, breakdown); // batalkan potongan lokal karena gagal simpan
    showBanner('formBanner_cuti','warn','Gagal menyimpan ke Google Sheets. Periksa koneksi internet Anda, lalu coba lagi. Data belum tersimpan.');
    return;
  }
  if(deducted) await pushSisaCutiToSheets();
  await Promise.all([fetchAllRecordsFromSheets(), fetchSisaCutiFromSheets()]);
  btn.disabled = false;
  showBanner('formBanner_cuti','ok', `Permohonan cuti untuk ${nama} berhasil disimpan (status: ${statusAwal}).`);
  resetCutiForm();
  renderSisaCutiTable();
}

/* ---------- CUTI BERJALAN ---------- */
function renderCutiBerjalan(){
  const list = allCutiRecords().filter(r=> r.detail.statusCuti === 'Pengajuan' || isCutiSedangBerjalanTanggal(r));
  const table = document.getElementById('cutiBerjalanTable');
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Tidak ada pengajuan atau cuti yang sedang berjalan.</td></tr>'; return; }
  table.innerHTML = '<tr><th>Nama</th><th>NIP</th><th>Bidang</th><th>Jenis Cuti</th><th>Tanggal Mulai</th><th>Tanggal Selesai</th><th>Jml Hari</th><th>Status Cuti</th></tr>' +
    list.slice().reverse().map(r=>`
      <tr>
        <td>${r.nama}</td><td>${r.nip||'-'}</td><td>${r.detail.bidang||'-'}</td>
        <td>${r.detail.jenisCuti||'-'}</td><td>${formatTanggalID(r.detail.tglMulai)}</td><td>${formatTanggalID(r.detail.tglSelesai)}</td>
        <td>${r.detail.jumlahHari||'-'}</td>
        <td><select data-status-id="${r.id}">${CUTI_STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===r.detail.statusCuti?'selected':''}>${s}</option>`).join('')}</select></td>
      </tr>`).join('');

  table.querySelectorAll('[data-status-id]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const rec = state.records.find(r=> r.id === sel.dataset.statusId);
      if(!rec) return;
      const prevStatus = rec.detail.statusCuti;
      const prevBreakdown = {
        potongBerjalanHari: rec.detail.potongBerjalanHari || 0,
        potongTahunLaluHari: rec.detail.potongTahunLaluHari || 0,
        potongDuaTahunLaluHari: rec.detail.potongDuaTahunLaluHari || 0,
        sudahDipotong: rec.detail.sudahDipotong || 'Tidak',
      };
      const newStatus = sel.value;
      sel.disabled = true;
      const wasDeducting = CUTI_DEDUCTING_STATUSES.includes(prevStatus);
      const willDeduct = CUTI_DEDUCTING_STATUSES.includes(newStatus);
      let appliedAmount = null; // jumlah yang baru saja dipotong (untuk dibatalkan bila gagal)
      let restoredAmount = null; // jumlah yang baru saja dikembalikan (untuk dipotong ulang bila gagal)

      if(!wasDeducting && willDeduct && rec.detail.sudahDipotong !== 'Ya'){
        const checks = { berjalan: rec.detail.tahunBerjalan==='Ya', tahunLalu: rec.detail.tahunLalu==='Ya', duaTahunLalu: rec.detail.duaTahunLalu==='Ya' };
        const bd = deductSisaCuti(rec.nip, parseFloat(rec.detail.jumlahHari)||0, checks);
        rec.detail.potongBerjalanHari = bd.berjalan;
        rec.detail.potongTahunLaluHari = bd.tahunLalu;
        rec.detail.potongDuaTahunLaluHari = bd.duaTahunLalu;
        rec.detail.sudahDipotong = 'Ya';
        appliedAmount = bd;
      } else if(wasDeducting && !willDeduct && rec.detail.sudahDipotong === 'Ya'){
        restoredAmount = {
          berjalan: Number(rec.detail.potongBerjalanHari)||0,
          tahunLalu: Number(rec.detail.potongTahunLaluHari)||0,
          duaTahunLalu: Number(rec.detail.potongDuaTahunLaluHari)||0,
        };
        restoreSisaCuti(rec.nip, restoredAmount);
        rec.detail.potongBerjalanHari = 0;
        rec.detail.potongTahunLaluHari = 0;
        rec.detail.potongDuaTahunLaluHari = 0;
        rec.detail.sudahDipotong = 'Tidak';
      }
      rec.detail.statusCuti = newStatus;

      const ok = await pushRecordToSheets(rec);
      if(!ok){
        // gagal simpan -> kembalikan semua perubahan lokal seperti semula
        if(appliedAmount) restoreSisaCuti(rec.nip, appliedAmount);
        if(restoredAmount) deductSisaCuti(rec.nip, restoredAmount.berjalan + restoredAmount.tahunLalu + restoredAmount.duaTahunLalu, { berjalan: restoredAmount.berjalan>0, tahunLalu: restoredAmount.tahunLalu>0, duaTahunLalu: restoredAmount.duaTahunLalu>0 });
        rec.detail.statusCuti = prevStatus;
        rec.detail.potongBerjalanHari = prevBreakdown.potongBerjalanHari;
        rec.detail.potongTahunLaluHari = prevBreakdown.potongTahunLaluHari;
        rec.detail.potongDuaTahunLaluHari = prevBreakdown.potongDuaTahunLaluHari;
        rec.detail.sudahDipotong = prevBreakdown.sudahDipotong;
        sel.value = prevStatus;
        sel.disabled = false;
        alert('Gagal menyimpan perubahan status ke Google Sheets. Periksa koneksi internet Anda.');
        return;
      }
      if(appliedAmount || restoredAmount) await pushSisaCutiToSheets();
      await Promise.all([fetchAllRecordsFromSheets(), fetchSisaCutiFromSheets()]);
      sel.disabled = false;
      renderCutiBerjalan();
      renderSisaCutiTable();
    });
  });
}

function renderRekapBidang(){
  const bidangFilter = document.getElementById('filterBidangCuti').value;
  const statusFilter = document.getElementById('filterStatusBidangCuti').value;
  const all = allCutiRecords().filter(r=> !statusFilter || r.detail.statusCuti === statusFilter);

  document.getElementById('rekapBidangSummary').innerHTML = BIDANG_OPTIONS.map(b=>{
    const n = all.filter(r=> r.detail.bidang === b).length;
    return `<div class="summary-card"><div class="num">${n}</div><div class="lbl">${b}</div></div>`;
  }).join('');

  const groups = bidangFilter ? [bidangFilter] : BIDANG_OPTIONS;
  const container = document.getElementById('rekapBidangGroups');
  container.innerHTML = groups.map(b=>{
    const rows = all.filter(r=> r.detail.bidang === b);
    const tableHTML = rows.length
      ? `<div class="preview-wrap"><table class="data-table">
          <tr><th>Nama</th><th>NIP</th><th>Jenis Cuti</th><th>Tgl Mulai</th><th>Tgl Selesai</th><th>Jml Hari</th><th>Status</th></tr>
          ${rows.slice().reverse().map(r=>`<tr>
            <td>${r.nama}</td><td>${r.nip||'-'}</td><td>${r.detail.jenisCuti||'-'}</td>
            <td>${formatTanggalID(r.detail.tglMulai)}</td><td>${formatTanggalID(r.detail.tglSelesai)}</td>
            <td>${r.detail.jumlahHari||'-'}</td><td>${r.detail.statusCuti||'-'}</td>
          </tr>`).join('')}
        </table></div>`
      : `<div class="empty-state">Tidak ada data untuk Bidang ini.</div>`;
    return `<h3 style="font-family:var(--serif);font-size:15px;font-weight:600;margin:20px 0 8px;">${b} <span style="color:var(--ink-soft);font-weight:400;font-size:13px;">(${rows.length} data)</span></h3>${tableHTML}`;
  }).join('');
}

function exportRekapBidangExcel(){
  const bidangFilter = document.getElementById('filterBidangCuti').value;
  const statusFilter = document.getElementById('filterStatusBidangCuti').value;
  const all = allCutiRecords().filter(r=> !statusFilter || r.detail.statusCuti === statusFilter);
  const groups = bidangFilter ? [bidangFilter] : BIDANG_OPTIONS;
  const wb = XLSX.utils.book_new();
  groups.forEach(b=>{
    const rows = all.filter(r=> r.detail.bidang === b);
    if(!rows.length) return;
    const aoa = [['Nama','NIP','Jenis Cuti','Tgl Mulai','Tgl Selesai','Jml Hari','Status'],
      ...rows.map(r=>[r.nama, r.nip||'', r.detail.jenisCuti||'', formatTanggalID(r.detail.tglMulai), formatTanggalID(r.detail.tglSelesai), r.detail.jumlahHari||'', r.detail.statusCuti||''])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), b.slice(0,31));
  });
  if(!wb.SheetNames.length){ alert('Tidak ada data untuk diekspor.'); return; }
  XLSX.writeFile(wb, `Rekap_Cuti_Bidang_${todayStamp()}.xlsx`);
}
function exportRekapBidangPDF(){
  const bidangFilter = document.getElementById('filterBidangCuti').value;
  const statusFilter = document.getElementById('filterStatusBidangCuti').value;
  const all = allCutiRecords().filter(r=> !statusFilter || r.detail.statusCuti === statusFilter);
  const groups = bidangFilter ? [bidangFilter] : BIDANG_OPTIONS;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  let wrote = false;
  groups.forEach(b=>{
    const rows = all.filter(r=> r.detail.bidang === b);
    if(!rows.length) return;
    if(wrote) doc.addPage();
    wrote = true;
    doc.setFontSize(12);
    doc.text(`Rekap Cuti - ${b}`, 14, 14);
    doc.autoTable({
      startY: 20,
      head: [['Nama','NIP','Jenis Cuti','Tgl Mulai','Tgl Selesai','Jml Hari','Status']],
      body: rows.map(r=>[r.nama, r.nip||'-', r.detail.jenisCuti||'-', formatTanggalID(r.detail.tglMulai), formatTanggalID(r.detail.tglSelesai), r.detail.jumlahHari||'-', r.detail.statusCuti||'-']),
      styles:{ fontSize:8 },
    });
  });
  if(!wrote){ alert('Tidak ada data untuk diekspor.'); return; }
  doc.save(`Rekap_Cuti_Bidang_${todayStamp()}.pdf`);
}

function wireRekapPerorangan(){
  const input = document.getElementById('searchPerorangan_cuti');
  const box = document.getElementById('resultsPerorangan_cuti');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(q.length<2){ box.style.display='none'; return; }
    const matches = state.employees.filter(e=> (e.nama||'').toLowerCase().includes(q) || (e.nip||'').toLowerCase().includes(q)).slice(0,15);
    if(!matches.length){ box.innerHTML='<div>Tidak ditemukan</div>'; box.style.display='block'; return; }
    box.innerHTML = matches.map((e,i)=>`<div data-idx="${i}">${e.nama} — ${e.nip||'-'}</div>`).join('');
    box.style.display='block';
    box.querySelectorAll('div[data-idx]').forEach(div=>{
      div.addEventListener('click', ()=>{
        const emp = matches[parseInt(div.dataset.idx,10)];
        input.value = emp.nama;
        box.style.display='none';
        renderRekapPerorangan(emp);
      });
    });
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#rekapCutiSub-perorangan')) box.style.display='none';
  });
}

function handleBidangExcel(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(e.target.result, { type:'binary' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(!aoa.length){ showBanner('bidangBanner','warn','File kosong.'); return; }
    const headers = aoa[0];
    const nipIdx = headers.findIndex(h=> String(h||'').toLowerCase().includes('nip'));
    const bidangIdx = headers.findIndex(h=> String(h||'').toLowerCase().includes('bidang'));
    const namaIdx = headers.findIndex(h=> String(h||'').toLowerCase().includes('nama'));
    if(nipIdx < 0 || bidangIdx < 0){ showBanner('bidangBanner','warn','Kolom NIP dan/atau Bidang tidak terdeteksi pada file ini.'); return; }
    let updated = 0, added = 0;
    aoa.slice(1).forEach(row=>{
      const nip = String(row[nipIdx]||'').trim();
      const bidang = normalizeBidang(row[bidangIdx]);
      if(!nip) return;
      let entry = state.bidangList.find(b=> b.nip === nip);
      if(entry){ entry.bidang = bidang; updated++; }
      else { state.bidangList.push({ nip, nama: namaIdx>=0? String(row[namaIdx]||'').trim() : '', bidang }); added++; }
    });
    Store.set('bidangList', state.bidangList);
    renderBidangTable();
    showBanner('bidangBanner','ok', `Berhasil memproses file: ${updated} diperbarui, ${added} ditambahkan. Mengirim ke Google Sheets...`);
    pushBidangToSheets(true);
  };
  reader.readAsBinaryString(file);
}

async function pushBidangToSheets(afterUpload){
  const url = state.settings.webAppUrl;
  if(!url){ showBanner('bidangBanner','warn','Atur URL Web App di tab Pengaturan (global) terlebih dahulu.'); return; }
  if(!afterUpload) showBanner('bidangBanner','info','Menyimpan data Bidang ke Google Sheets...');
  try{
    const res = await fetch(url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ type:'bidang', items: state.bidangList })
    });
    const json = await res.json();
    if(json.error){ showBanner('bidangBanner','warn','Gagal: ' + json.error); return; }
    showBanner('bidangBanner','ok', `Data Bidang (${state.bidangList.length} pegawai) tersimpan ke Google Sheets.`);
  }catch(err){
    showBanner('bidangBanner','warn','Gagal terhubung ke Web App. Detail: ' + err.message);
  }
}

   DASHBOARD & REKAP PER PERIODE

const REPORT_DATE_FIELD_MAP = {
  cuti:'tglMulai',
  pernikahan:'tglPersetujuanPimpinan',
  perceraian:'tglPersetujuanPimpinan',
  keluarnegeri:'tglPersetujuanPimpinan',
  diklat:'tglMulai',
  magang:'tglMulai',
  ujikom:'tglUjian',
  ujiandinas:'tglUjian',
  disiplin:'tglSk'
};

// Kategori dengan lebih dari satu pilihan dasar tanggal untuk rekap (menampilkan
// dropdown "Dasar Rekap": Tanggal Input atau Periode).
const REPORT_DATE_FIELD_OPTIONS_MAP = {
  usulpangkat: ['tglInput','periode'],
  pencantumangelar: ['tglInput','periode'],
  kgb: ['tglInput','periode'],
  mutasilokal: ['tglInput','periode'],
  usulfungsional: ['tglInput','periode'],
  peninjauanmasakerja: ['tglInput','periode'],
  penerimaancpns: ['tglInput','periode'],
  penerimaanpppk: ['tglInput','periode'],
  usulcpnskepns: ['tglInput','periode'],
};

function reportDateFieldOptions(cat){ return REPORT_DATE_FIELD_OPTIONS_MAP[cat.key] || null; }

function reportDateField(cat){
  const opts = reportDateFieldOptions(cat);
  if(opts){
    const basisEl = document.getElementById(`reportBasis_${cat.key}`);
    return (basisEl && opts.includes(basisEl.value)) ? basisEl.value : opts[0];
  }
  const preferred=REPORT_DATE_FIELD_MAP[cat.key];
  if(preferred && cat.fields.some(f=>f.id===preferred)) return preferred;
  const firstDate=cat.fields.find(f=>f.type==='date'||f.type==='month');
  return firstDate ? firstDate.id : null;
}
function reportDateValue(r,cat){
  const fid=reportDateField(cat);
  return fid ? r.detail?.[fid] : r.tanggalInput;
}
function safeDate(str){
  const d=new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
function periodInfo(type,year,period){
  if(type==='monthly') return {label:`Bulan ${BULAN_NAMES[period-1]} ${year}`, maxMonth:period};
  if(type==='quarterly') return {label:`Triwulan ${period} Tahun ${year}`, maxMonth:period*3};
  return {label:`Semester ${period} Tahun ${year}`, maxMonth:period*6};
}
function getPeriodOptions(type){
  if(type==='monthly') return BULAN_NAMES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  if(type==='quarterly') return [1,2,3,4].map(q=>`<option value="${q}">Triwulan ${q}</option>`).join('');
  return [1,2].map(s=>`<option value="${s}">Semester ${s}</option>`).join('');
}
function filterRecordsByPeriod(records,cat,type,year,period,accumulate){
  const maxMonth=periodInfo(type,year,period).maxMonth;
  return records.filter(r=>{
    const d=safeDate(reportDateValue(r,cat));
    if(!d || d.getFullYear()!==year) return false;
    const m=d.getMonth()+1;
    if(accumulate) return m<=maxMonth;
    const minMonth=type==='monthly'?maxMonth:(maxMonth-(type==='quarterly'?2:5));
    return m>=minMonth && m<=maxMonth;
  });
}
function reportYearOptions(){
  const years=new Set(state.records.map(r=>safeDate(r.tanggalInput)?.getFullYear()).filter(Boolean));
  state.records.forEach(r=> CATEGORIES.forEach(cat=>{ const d=safeDate(reportDateValue(r,cat)); if(d) years.add(d.getFullYear()); }));
  if(!years.size) years.add(new Date().getFullYear());
  return Array.from(years).sort((a,b)=>b-a);
}
function reportPanelHTML(cat){
  const years=reportYearOptions();
  const now=new Date();
  const defaultYear=now.getFullYear();
  const defaultMonth=now.getMonth()+1;
  const dateOpts = reportDateFieldOptions(cat);
  const basisSelectHTML = dateOpts ? `
        <div class="field">
          <label>Dasar Rekap</label>
          <select id="reportBasis_${cat.key}">
            ${dateOpts.map(id=>{ const f=cat.fields.find(x=>x.id===id); return `<option value="${id}">${f?f.label:id}</option>`; }).join('')}
          </select>
        </div>` : '';
  return `
  <section class="panel" id="panel-report-${cat.key}">
    <div class="card">
      <h2>Rekap ${cat.label}</h2>
      <p class="hint">Rincian laporan mengikuti seluruh kolom yang tersedia pada form <strong>${cat.label}</strong>. Periode dihitung dari <strong>${(cat.fields.find(f=>f.id===reportDateField(cat))||{}).label||'Tanggal Input'}</strong>.</p>
      <div class="report-toolbar">
        ${basisSelectHTML}
        <div class="field">
          <label>Periode Rekap</label>
          <select id="reportType_${cat.key}">
            <option value="monthly">Rekap Per Bulanan</option>
            <option value="quarterly">Rekap Per Triwulan</option>
            <option value="semester">Rekap Semester</option>
          </select>
        </div>
        <div class="field">
          <label>Tahun</label>
          <select id="reportYear_${cat.key}">${years.map(y=>`<option value="${y}" ${y===defaultYear?'selected':''}>${y}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Periode</label>
          <select id="reportPeriod_${cat.key}">${getPeriodOptions('monthly')}</select>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="reportAcc_${cat.key}">
          <label for="reportAcc_${cat.key}">Akumulasi sampai periode terpilih</label>
        </div>
      </div>
      <div class="report-meta" id="reportMeta_${cat.key}"></div>
      <div class="summary-cards" id="reportSummary_${cat.key}"></div>
      <div class="preview-wrap"><table class="data-table" id="reportTable_${cat.key}"></table></div>
      <div class="btn-row">
        <button class="btn secondary" data-report-excel="${cat.key}">Ekspor Excel</button>
        <button class="btn secondary" data-report-pdf="${cat.key}">Ekspor PDF</button>
      </div>
    </div>
  </section>`;
}
function periodRangeText(type,year,period,acc){
  const p=periodInfo(type,year,period);
  return acc ? `${p.label} (akumulasi dari Januari ${year})` : p.label;
}
function formatBulanID(value){
  if(!value) return '-';
  const [y,m] = String(value).split('-');
  if(!y || !m) return String(value);
  const idx = parseInt(m,10)-1;
  return (BULAN_NAMES[idx] || m) + ' ' + y;
}
function renderCategoryReport(key,rebuild=false){
  const cat=CATEGORIES.find(c=>c.key===key);
  if(!cat) return;
  const typeEl=document.getElementById(`reportType_${key}`);
  const yearEl=document.getElementById(`reportYear_${key}`);
  const periodEl=document.getElementById(`reportPeriod_${key}`);
  const accEl=document.getElementById(`reportAcc_${key}`);
  if(!typeEl||!yearEl||!periodEl) return;
  if(rebuild){
    const oldType=typeEl.value;
    const oldPeriod=periodEl.value;
    const type=oldType||'monthly';
    periodEl.innerHTML=getPeriodOptions(type);
    if(Array.from(periodEl.options).some(o=>o.value===oldPeriod)) periodEl.value=oldPeriod;
    else periodEl.value=type==='monthly'?String(new Date().getMonth()+1):'1';
  }
  const type=typeEl.value;
  const year=parseInt(yearEl.value,10);
  const period=parseInt(periodEl.value,10);
  const acc=accEl.checked;
  const list=filterRecordsByPeriod(state.records.filter(r=>r.kategoriKey===key),cat,type,year,period,acc);
  const meta=document.getElementById(`reportMeta_${key}`);
  meta.textContent=periodRangeText(type,year,period,acc)+` • ${list.length} data`;
  const sum=document.getElementById(`reportSummary_${key}`);
  const statuses=cat.fields.filter(f=>f.type==='select').slice(0,3);
  sum.innerHTML=`<div class="summary-card"><div class="num">${list.length}</div><div class="lbl">Total ${cat.label}</div></div>`+
    statuses.map(f=>{
      const counts={};
      list.forEach(r=>{const v=r.detail?.[f.id]||'Tidak diisi'; counts[v]=(counts[v]||0)+1;});
      return Object.entries(counts).slice(0,4).map(([v,n])=>`<div class="summary-card"><div class="num">${n}</div><div class="lbl">${f.label}: ${v}</div></div>`).join('');
    }).join('');
  const table=document.getElementById(`reportTable_${key}`);
  if(!list.length){ table.innerHTML='<tr><td class="empty-state">Tidak ada data pada periode ini.</td></tr>'; return; }
  const statusField = cat.fields.find(f=> f.id==='status' && f.type==='select');
  const headers=['Nama','NIP/Keterangan','Jabatan','Unit Kerja',...cat.fields.map(f=>f.label),'Catatan','Tanggal Input'];
  table.innerHTML='<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>'+
    list.slice().sort((a,b)=>String(reportDateValue(b,cat)||'').localeCompare(String(reportDateValue(a,cat)||''))).map(r=>{
      const cells=[r.nama||'',r.nip||'-',r.jabatan||'-',r.unit||'-'];
      cat.fields.forEach(f=>{
        if(statusField && f.id===statusField.id){
          cells.push(`<select data-status-record="${r.id}" data-cat-key="${key}">${statusField.options.map(o=>`<option value="${o}" ${o===(r.detail?.[f.id])?'selected':''}>${o}</option>`).join('')}</select>`);
        } else if(f.type==='date'){
          cells.push(formatTanggalID(r.detail?.[f.id]));
        } else if(f.type==='month'){
          cells.push(formatBulanID(r.detail?.[f.id]));
        } else {
          cells.push(r.detail?.[f.id]||'-');
        }
      });
      cells.push(r.catatan||'-', r.tanggalInput?new Date(r.tanggalInput).toLocaleDateString('id-ID'):'-');
      return '<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';
    }).join('');

  if(statusField){
    table.querySelectorAll('[data-status-record]').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const rec = state.records.find(r=> r.id === sel.dataset.statusRecord);
        if(!rec) return;
        const prevVal = rec.detail[statusField.id];
        sel.disabled = true;
        rec.detail[statusField.id] = sel.value;
        const ok = await pushRecordToSheets(rec);
        if(!ok){
          rec.detail[statusField.id] = prevVal;
          sel.value = prevVal;
          sel.disabled = false;
          alert('Gagal menyimpan perubahan status ke Google Sheets. Periksa koneksi internet Anda.');
          return;
        }
        await fetchAllRecordsFromSheets();
        renderCategoryReport(key, false);
      });
    });
  }
}
function refreshAllReportYearOptions(){
  const years=reportYearOptions();
  const selects=[
    document.getElementById('dashYear'),
    ...CATEGORIES.map(cat=>document.getElementById(`reportYear_${cat.key}`))
  ].filter(Boolean);
  selects.forEach(sel=>{
    const current=sel.value || String(new Date().getFullYear());
    sel.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
    sel.value=years.some(y=>String(y)===String(current))?current:String(years[0]);
  });
}

function wireCategoryReports(){
  CATEGORIES.forEach(cat=>{
    const typeEl=document.getElementById(`reportType_${cat.key}`);
    const yearEl=document.getElementById(`reportYear_${cat.key}`);
    const periodEl=document.getElementById(`reportPeriod_${cat.key}`);
    const accEl=document.getElementById(`reportAcc_${cat.key}`);
    const basisEl=document.getElementById(`reportBasis_${cat.key}`);
    if(!typeEl) return;
    const rerender=()=>renderCategoryReport(cat.key,false);
    const rerenderFull=()=>renderCategoryReport(cat.key,true);
    typeEl.addEventListener('change',()=>{
      const old=periodEl.value;
      periodEl.innerHTML=getPeriodOptions(typeEl.value);
      periodEl.value=Array.from(periodEl.options).some(o=>o.value===old)?old:(typeEl.value==='monthly'?String(new Date().getMonth()+1):'1');
      rerender();
    });
    yearEl.addEventListener('change',rerender);
    periodEl.addEventListener('change',rerender);
    accEl.addEventListener('change',rerender);
    if(basisEl) basisEl.addEventListener('change', rerenderFull);
    document.querySelector(`[data-report-excel="${cat.key}"]`).addEventListener('click',()=>{
      exportTableToExcel(`reportTable_${cat.key}`,`Rekap_${cat.sheet.replace(/\s+/g,'_')}_${todayStamp()}.xlsx`,cat.label);
    });
    document.querySelector(`[data-report-pdf="${cat.key}"]`).addEventListener('click',()=>{
      exportTableToPDF(`reportTable_${cat.key}`,`Rekap_${cat.sheet.replace(/\s+/g,'_')}_${todayStamp()}.pdf`,`Rekap ${cat.label}`);
    });
    renderCategoryReport(cat.key,true);
  });
}
/* =========================================================
   REKAP PEGAWAI (Jenis Kelamin per Satker) — dari snapshot bulanan
   yang disimpan lewat Pengaturan -> "Simpan Ke Laporan".
   ========================================================= */
function monthGroupKey(bulan, type){
  const [y, m] = bulan.split('-').map(Number);
  if(type==='triwulan') return `${y}-Q${Math.ceil(m/3)}`;
  if(type==='semester') return `${y}-S${m<=6?1:2}`;
  return bulan;
}
function monthGroupLabel(groupKey, type){
  const [y, part] = groupKey.split('-');
  if(type==='triwulan') return `Triwulan ${part.replace('Q','')} ${y}`;
  if(type==='semester') return `Semester ${part.replace('S','')} ${y}`;
  return formatBulanID(groupKey);
}

function renderRekapPegawai(rebuild){
  const typeEl = document.getElementById('rekapPegawaiType');
  const periodEl = document.getElementById('rekapPegawaiPeriod');
  const table = document.getElementById('rekapPegawaiTable');
  const metaEl = document.getElementById('rekapPegawaiMeta');
  if(!typeEl || !periodEl || !table) return;
  const type = typeEl.value;

  const months = Array.from(new Set(state.rekapPegawaiList.map(r=> r.bulan))).sort().reverse(); // terbaru dulu
  const groupToLatestMonth = {};
  months.forEach(m=>{
    const gk = monthGroupKey(m, type);
    if(!groupToLatestMonth[gk]) groupToLatestMonth[gk] = m; // pertama ditemukan = bulan terbaru pada grup itu
  });
  const groupKeys = Object.keys(groupToLatestMonth).sort().reverse();

  if(rebuild){
    const current = periodEl.value;
    periodEl.innerHTML = groupKeys.map(gk=> `<option value="${gk}">${monthGroupLabel(gk,type)}</option>`).join('');
    if(groupKeys.includes(current)) periodEl.value = current;
  }
  const selectedGroup = periodEl.value;
  const targetMonth = groupToLatestMonth[selectedGroup];

  if(!targetMonth){
    table.innerHTML = '<tr><td class="empty-state">Belum ada data rekap. Simpan Data Pegawai Termuat lewat Pengaturan &rarr; "Simpan Ke Laporan" terlebih dahulu.</td></tr>';
    metaEl.textContent = '';
    return;
  }
  metaEl.textContent = `Menampilkan rekap bulan ${formatBulanID(targetMonth)}`;

  const rows = state.rekapPegawaiList.filter(r=> r.bulan === targetMonth).sort((a,b)=> String(a.satker).localeCompare(String(b.satker)));
  const sum = { laki:0, perempuan:0, jaksaLk:0, jaksaPr:0, tuLk:0, tuPr:0, total:0 };
  table.innerHTML = '<tr><th>No</th><th>Satuan Kerja</th><th>Laki-laki</th><th>Perempuan</th><th>Jaksa Lk</th><th>Jaksa Pr</th><th>TU Lk</th><th>TU Pr</th><th>Total</th></tr>' +
    rows.map((r,i)=>{
      sum.laki+=r.laki; sum.perempuan+=r.perempuan; sum.jaksaLk+=r.jaksaLk; sum.jaksaPr+=r.jaksaPr; sum.tuLk+=r.tuLk; sum.tuPr+=r.tuPr; sum.total+=r.total;
      return `<tr><td>${i+1}</td><td style="text-align:left">${r.satker}</td><td>${r.laki}</td><td>${r.perempuan}</td><td>${r.jaksaLk}</td><td>${r.jaksaPr}</td><td>${r.tuLk}</td><td>${r.tuPr}</td><td>${r.total}</td></tr>`;
    }).join('') +
    `<tr style="font-weight:600;"><td colspan="2">TOTAL KESELURUHAN</td><td>${sum.laki}</td><td>${sum.perempuan}</td><td>${sum.jaksaLk}</td><td>${sum.jaksaPr}</td><td>${sum.tuLk}</td><td>${sum.tuPr}</td><td>${sum.total}</td></tr>`;
}

  document.getElementById('rekapPegawaiType').addEventListener('change', ()=> renderRekapPegawai(true));

function dashboardPeriodRecords(type,year,period,acc){
  const all=[];
  CATEGORIES.forEach(cat=>all.push(...filterRecordsByPeriod(state.records.filter(r=>r.kategoriKey===cat.key),cat,type,year,period,acc)));
  return all;
}
function dashboardEsc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function dashboardPeriodLabel(type,period,year){
  if(type==='monthly') return `${BULAN_NAMES[period-1]} ${year}`;
  if(type==='quarterly') return `Triwulan ${period} ${year}`;
  return `Semester ${period} ${year}`;
}
function dashboardMonthCounts(cat,year,accMonth){
  const rows=state.records.filter(r=>r.kategoriKey===cat.key);
  const counts=Array(12).fill(0);
  rows.forEach(r=>{
    const d=safeDate(reportDateValue(r,cat));
    if(d && d.getFullYear()===year && d.getMonth()<accMonth) counts[d.getMonth()]++;
  });
  return counts;
}
function dashboardBarSVG(labels,values,height=270){
  const W=900,H=height,pad={l:42,r:18,t:18,b:48},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const max=Math.max(1,...values), step=cw/Math.max(1,values.length), bw=Math.max(12,step*.58);
  const grid=[0,.25,.5,.75,1];
  let out=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">`;
  grid.forEach(g=>{const y=pad.t+ch-(ch*g);out+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="currentColor" opacity=".10"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".55">${Math.round(max*g)}</text>`});
  values.forEach((v,i)=>{const x=pad.l+i*step+(step-bw)/2,y=pad.t+ch-(v/max)*ch,h=(v/max)*ch;out+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h)}" rx="6" fill="currentColor" opacity=".82"><title>${dashboardEsc(labels[i])}: ${v}</title></rect><text x="${x+bw/2}" y="${H-19}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".65">${dashboardEsc(labels[i])}</text>`});
  return out+`</svg>`;
}
function dashboardLineSVG(labels,values,height=270){
  const W=900,H=height,pad={l:42,r:18,t:18,b:48},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,max=Math.max(1,...values),step=cw/Math.max(1,values.length-1);
  let pts=''; values.forEach((v,i)=>{pts+=`${pad.l+i*step},${pad.t+ch-(v/max)*ch} `});
  let out=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">`;
  [.0,.25,.5,.75,1].forEach(g=>{const y=pad.t+ch-ch*g;out+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="currentColor" opacity=".10"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".55">${Math.round(max*g)}</text>`});
  out+=`<polyline points="${pts.trim()}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
  values.forEach((v,i)=>{const x=pad.l+i*step,y=pad.t+ch-(v/max)*ch;out+=`<circle cx="${x}" cy="${y}" r="4.5" fill="currentColor"><title>${dashboardEsc(labels[i])}: ${v}</title></circle><text x="${x}" y="${H-19}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".65">${dashboardEsc(labels[i])}</text>`});
  return out+`</svg>`;
}
function dashboardMiniBarSVG(values){
  const W=520,H=120,pad={l:4,r:4,t:8,b:24},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,max=Math.max(1,...values),step=cw/12,bw=Math.max(5,step*.62);
  let out=`<svg class="mini-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  values.forEach((v,i)=>{const x=pad.l+i*step+(step-bw)/2,y=pad.t+ch-(v/max)*ch,h=(v/max)*ch;out+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h)}" rx="3" fill="currentColor" opacity=".78"><title>${BULAN_NAMES[i]}: ${v}</title></rect>`});
  [0,3,6,9].forEach(i=>out+=`<text x="${pad.l+i*step+step/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55">${BULAN_NAMES[i].slice(0,3)}</text>`);
  return out+'</svg>';
}

function renderDashboard(){
  const type=document.getElementById('dashType'),year=document.getElementById('dashYear'),period=document.getElementById('dashPeriod'),acc=document.getElementById('dashAcc');
  if(!type||!year||!period) return;
  const y=parseInt(year.value,10)||new Date().getFullYear(),p=parseInt(period.value,10)||1,a=acc.checked;
  const list=dashboardPeriodRecords(type.value,y,p,a);
  const label=periodRangeText(type.value,y,p,a);
  document.getElementById('dashMeta').textContent=`${label} • ${list.length} total data`;
  const counts=CATEGORIES.map(cat=>list.filter(r=>r.kategoriKey===cat.key).length);
  const total=counts.reduce((a,b)=>a+b,0),active=counts.filter(Boolean).length;
  const topIndex=counts.length?counts.indexOf(Math.max(...counts)):-1;
  document.getElementById('dashboardKpis').innerHTML=`
    <div class="dashboard-kpi"><div class="kpi-label">TOTAL DATA</div><div class="kpi-value">${total}</div><div class="kpi-note">Pada periode terpilih</div></div>
    <div class="dashboard-kpi"><div class="kpi-label">KATEGORI AKTIF</div><div class="kpi-value">${active}</div><div class="kpi-note">Dari ${CATEGORIES.length} kategori</div></div>
    <div class="dashboard-kpi"><div class="kpi-label">TERTINGGI</div><div class="kpi-value">${topIndex>=0?counts[topIndex]:0}</div><div class="kpi-note">${topIndex>=0?dashboardEsc(CATEGORIES[topIndex].label):'Belum ada data'}</div></div>
    <div class="dashboard-kpi"><div class="kpi-label">MODE REKAP</div><div class="kpi-value" style="font-size:21px">${a?'AKUMULASI':'PERIODE'}</div><div class="kpi-note">${dashboardEsc(label)}</div></div>`;
  const labels=CATEGORIES.map(c=>c.label.replace('Izin ','').replace('Hukuman ','').replace('Ujian ','U. '));
  document.getElementById('dashCategoryChart').innerHTML=dashboardBarSVG(labels,counts);
  const currentMonth=type.value==='monthly'?p:type.value==='quarterly'?p*3:p*6;
  const trend=Array(12).fill(0);
  CATEGORIES.forEach(cat=>dashboardMonthCounts(cat,y,currentMonth).forEach((v,i)=>{if(!a && i>=currentMonth) return; trend[i]+=v;}));
  const trendLabels=BULAN_NAMES.map(m=>m.slice(0,3));
  document.getElementById('dashTrendChart').innerHTML=dashboardLineSVG(trendLabels,trend);
  document.getElementById('dashCategoryMiniCharts').innerHTML=CATEGORIES.map(cat=>{
    const vals=dashboardMonthCounts(cat,y,currentMonth);
    const visible=vals.map((v,i)=>((!a && i>=currentMonth)?0:v));
    const n=counts[CATEGORIES.indexOf(cat)];
    return `<div class="category-chart"><div class="cat-name">${dashboardEsc(cat.label)}</div>${dashboardMiniBarSVG(visible)}<div class="cat-total">${n} data pada ${dashboardEsc(label)}</div></div>`;
  }).join('');
  const byCat=CATEGORIES.map(cat=>{
    const rows=list.filter(r=>r.kategoriKey===cat.key),statusField=cat.fields.find(f=>f.type==='select');
    const detail=statusField?Array.from(new Set(rows.map(r=>r.detail?.[statusField.id]).filter(Boolean))).map(v=>`${dashboardEsc(v)}: ${rows.filter(r=>r.detail?.[statusField.id]===v).length}`).join(' · '):'-';
    return [cat.label,rows.length,detail];
  });
  document.getElementById('dashboardTable').innerHTML='<tr><th>Kategori</th><th>Jumlah</th><th>Rincian Status/Pilihan</th></tr>'+byCat.map(r=>`<tr><td>${dashboardEsc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
}

function wireDashboard(){
  const type=document.getElementById('dashType'),year=document.getElementById('dashYear'),period=document.getElementById('dashPeriod'),acc=document.getElementById('dashAcc');
  const years=reportYearOptions();
  year.innerHTML=years.map(y=>`<option value="${y}" ${y===new Date().getFullYear()?'selected':''}>${y}</option>`).join('');
  type.addEventListener('change',()=>{period.innerHTML=getPeriodOptions(type.value);period.value=type.value==='monthly'?String(new Date().getMonth()+1):'1';renderDashboard();});
  year.addEventListener('change',renderDashboard); period.addEventListener('change',renderDashboard); acc.addEventListener('change',renderDashboard);
  renderDashboard();
}
