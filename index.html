function currentFilteredRecords(){
  const kategori = document.getElementById('filterKategori').value;
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  return state.records.filter(r=>{
    if(kategori && r.kategoriKey !== kategori) return false;
    if(q && !(r.nama.toLowerCase().includes(q) || (r.nip||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderRekap(){
  const summaryEl = document.getElementById('summaryCards');
  summaryEl.innerHTML = CATEGORIES.map(c=>{
    const n = state.records.filter(r=>r.kategoriKey===c.key).length;
    return `<div class="summary-card"><div class="num">${n}</div><div class="lbl">${c.label}</div></div>`;
  }).join('');
  renderRecordsTable();
}

function ringkasanDetail(r){
  const cat = CATEGORIES.find(c=>c.key===r.kategoriKey);
  return cat.fields.slice(0,3).map(f=> r.detail[f.id] ? `${f.label}: ${r.detail[f.id]}` : null).filter(Boolean).join(' · ');
}

function renderRecordsTable(){
  const list = currentFilteredRecords();
  const table = document.getElementById('recordsTable');
  if(!list.length){ table.innerHTML = '<tr><td class="empty-state">Belum ada data yang cocok dengan filter.</td></tr>'; return; }
  table.innerHTML = '<tr><th>Kategori</th><th>Nama</th><th>NIP/Ket.</th><th>Jabatan/Unit</th><th>Ringkasan</th><th>Tgl Input</th><th>Aksi</th></tr>' +
    list.slice().reverse().map(r=>`
      <tr>
        <td>${r.kategoriLabel}</td>
        <td>${r.nama}</td>
        <td>${r.nip||'-'}</td>
        <td>${r.jabatan||'-'}${r.unit? ' / '+r.unit:''}</td>
        <td>${ringkasanDetail(r)}</td>
        <td>${new Date(r.tanggalInput).toLocaleDateString('id-ID')}</td>
        <td><button class="btn danger" data-del="${r.id}" data-cat="${r.kategoriKey}" style="padding:4px 8px;font-size:12px;">Hapus</button></td>
      </tr>`).join('');

  table.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Hapus data ini? Data akan dihapus permanen dari Google Sheets.')) return;
      btn.disabled = true;
      const ok = await deleteRecordFromSheets(btn.dataset.cat, btn.dataset.del);
      if(!ok){
        btn.disabled = false;
        alert('Gagal menghapus data di Google Sheets. Periksa koneksi internet Anda.');
        return;
      }
      await fetchAllRecordsFromSheets();
      renderRekap();
    });
  });
}

/* ---------- Ekspor generik (dipakai di semua tampilan rekap) ---------- */
function todayStamp(){ return new Date().toISOString().slice(0,10); }

function exportTableToExcel(tableId, filename, sheetName){
  const table = document.getElementById(tableId);
  if(!table || !table.querySelector('th')){ alert('Tidak ada data untuk diekspor.'); return; }
  const wb = XLSX.utils.table_to_book(table, { sheet: (sheetName||'Sheet1').slice(0,31) });
  XLSX.writeFile(wb, filename);
}
function exportTableToPDF(tableId, filename, title){
  const table = document.getElementById(tableId);
  if(!table || !table.querySelector('th')){ alert('Tidak ada data untuk diekspor.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  doc.setFontSize(12);
  doc.text(title, 14, 12);
  doc.autoTable({ html: '#'+tableId, startY: 18, styles:{ fontSize:8 } });
  doc.save(filename);
}

function exportToExcel(){
  const list = currentFilteredRecords();
  if(!list.length){ showBanner('rekapBanner','warn','Tidak ada data untuk diekspor.'); return; }
  const wb = XLSX.utils.book_new();
  CATEGORIES.forEach(cat=>{
    const rows = list.filter(r=>r.kategoriKey===cat.key);
    if(!rows.length) return;
    const header = ['Sumber','NIP/Keterangan','Nama','Jabatan','Unit Kerja', ...cat.fields.map(f=>f.label), 'Catatan','Tanggal Input'];
    const aoa = [header, ...rows.map(r=> [
      r.sumber, r.nip||'', r.nama, r.jabatan||'', r.unit||'',
      ...cat.fields.map(f=> f.type==='date' ? formatTanggalID(r.detail[f.id]) : (r.detail[f.id]||'')),
      r.catatan||'', new Date(r.tanggalInput).toLocaleString('id-ID')
    ])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, cat.sheet.slice(0,31));
  });
  const filename = `Data_Kepegawaian_${todayStamp()}.xlsx`;
  XLSX.writeFile(wb, filename);
  showBanner('rekapBanner','ok', `Berhasil diekspor sebagai ${filename}.`);
}

function exportRekapUtamaPDF(){
  exportTableToPDF('recordsTable', `Data_Kepegawaian_${todayStamp()}.pdf`, 'Rekap Data Kepegawaian');
}

/* =========================================================
   INISIALISASI HALAMAN
   ========================================================= */
async function init(){
  buildNav();
  mainArea.innerHTML =
    panelDashboardHTML() +
    CATEGORIES.filter(c=> c.key!=='cuti' && !MONTHLY_RECAP_KEYS.includes(c.key)).map(panelCategoryHTML).join('') +
    CATEGORIES.filter(c=> MONTHLY_RECAP_KEYS.includes(c.key)).map(panelCategoryWithMonthlyRekapHTML).join('') +
    panelCutiHTML() +
    panelRekapPegawaiHTML() +
    CATEGORIES.map(reportPanelHTML).join('') +
    panelPengaturanHTML();

  state.employees = await Store.get('employees', []);
  state.records = await Store.get('records', []);
  populateSuggestionDatalists();
  populateManualSuggestionDatalists();
  state.settings = await Store.get('settings', { webAppUrl:'', sheetPegawai:'Sheet1' });
  state.bidangList = await Store.get('bidangList', []);
  state.sisaCutiList = await Store.get('sisaCutiList', []);
  state.rekapPegawaiList = await Store.get('rekapPegawaiList', []);
  refreshAllReportYearOptions();

  document.getElementById('inpWebAppUrl').value = state.settings.webAppUrl || '';
  document.getElementById('inpSheetPegawai').value = state.settings.sheetPegawai || 'Pegawai';
  renderEmployeeSummary();

  document.getElementById('btnFetchPegawai').addEventListener('click', fetchPegawaiFromGoogle);
  document.getElementById('inpFileExcel').addEventListener('change', (e)=>{
    if(e.target.files[0]) handleExcelFile(e.target.files[0]);
  });
  document.getElementById('btnUseMapping').addEventListener('click', confirmMapping);
  document.getElementById('btnCancelMapping').addEventListener('click', ()=>{
    document.getElementById('mappingCard').style.display='none';
    state.rawImport = null;
  });
  document.getElementById('testSearchEmployee').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const list = q ? state.employees.filter(x=> x.nama.toLowerCase().includes(q) || (x.nip||'').toLowerCase().includes(q)) : state.employees.slice(0,50);
    renderEmployeeTable(list.slice(0,50));
  });
  document.getElementById('btnSimpanKeLaporan').addEventListener('click', handleSimpanKeLaporan);

  CATEGORIES.filter(c=>c.key!=='cuti').forEach(cat=>{
    state.selectedEmployee[cat.key] = null;
    wireCategoryPanel(cat);
    if(MONTHLY_RECAP_KEYS.includes(cat.key)) wireMonthlyRekap(cat);
  });
  wireCutiPanel();

  wireDashboard();
  wireCategoryReports();
  wireRekapPegawaiPanel();
  renderRekapPegawai(true);

  document.getElementById('btnSaveSettings').addEventListener('click', async ()=>{
    state.settings = {
      webAppUrl: document.getElementById('inpWebAppUrl').value.trim(),
      sheetPegawai: document.getElementById('inpSheetPegawai') ? document.getElementById('inpSheetPegawai').value.trim() : 'Sheet1'
    };
    Store.set('settings', state.settings);
    showBanner('settingsBanner','ok','Pengaturan tersimpan. Memuat data realtime...');
    await bootstrapRealtimeData();
  });
  document.getElementById('btnTestConn').addEventListener('click', async ()=>{
    const url = state.settings.webAppUrl || document.getElementById('inpWebAppUrl').value.trim();
    if(!url){ showBanner('settingsBanner','warn','Isi URL Web App terlebih dahulu.'); return; }
    showBanner('settingsBanner','info','Menguji koneksi...');
    try{
      const res = await fetch(`${url}?action=getPegawai&sheet=${encodeURIComponent(state.settings.sheetPegawai||'Pegawai')}`);
      const json = await res.json();
      if(json.error) showBanner('settingsBanner','warn','Terhubung, tetapi Apps Script mengembalikan error: ' + json.error);
      else showBanner('settingsBanner','ok','Koneksi berhasil! Web App merespons dengan baik.');
    }catch(err){
      showBanner('settingsBanner','warn','Koneksi gagal: ' + err.message);
    }
  });

  showTab('dashboard');
  await bootstrapRealtimeData();
  startRealtimePolling();
}

/** Memuat data awal dari Google Sheets (dipanggil saat aplikasi dibuka & saat
 *  URL Web App baru disimpan), lalu me-render ulang tampilan yang aktif. */
async function bootstrapRealtimeData(){
  if(!state.settings.webAppUrl){ updateSyncIndicator('off'); return; }
  await autoLoadEmployeesIfConfigured();
  await refreshFromSheetsAndRender();
}

/** Polling berkala (setiap 25 detik, hanya saat tab terlihat) + refresh
 *  langsung saat tab kembali aktif, agar semua pengguna cepat melihat
 *  perubahan satu sama lain tanpa perlu me-refresh manual. */
function startRealtimePolling(){
  setInterval(()=>{
    if(document.visibilityState === 'visible' && state.settings.webAppUrl){
      refreshFromSheetsAndRender();
    }
  }, 25000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.settings.webAppUrl){
      refreshFromSheetsAndRender();
    }
  });
}

init();
